name: Build LSPatch Fanqie APK
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build hook module
        run: bash .github/scripts/build-module.sh
      - name: Download official APK
        env:
          URL: >-
            https://cloud.dsdog.tk/d/google/temp/%%E7%%95%%AA%%E8%%8C%%84%%E5%%85%%8D%%E8%%B4%%B9%%E5%%B0%%8F%%E8%%AF%%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
        run: curl -sL "$URL" -o /tmp/official.apk
      - name: Download LSPatch
        run: >-
          curl -sL -o /tmp/lspatch.jar
          https://github.com/LSPosed/LSPatch/releases/download/v0.6/jar-v0.6-398-release.jar
      - name: Patch with LSPatch
        run: >-
          java -jar /tmp/lspatch.jar /tmp/official.apk
          -m 0 --embed /tmp/module.apk -c -f
          -o /tmp/final.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-clean
          path: /tmp/final.apk
          retention-days: 30
