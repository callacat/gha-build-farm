name: Build NPatch Fanqie APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Download files
        run: |
          curl -sL --max-time 300 "$URL" -o /tmp/official.apk
          curl -sL -o /tmp/module.apk \
            https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie-hook-module-v3.apk
          curl -sL -o /tmp/npatch.jar \
            https://github.com/7723mod/NPatch/releases/download/v1.0.5/jar-v1.0.5-639-release.jar
        env:
          URL: 'https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0'
      - name: Sign module
        run: |
          keytool -genkey -v -keystore /tmp/ks -alias m \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=M,O=M,C=CC" 2>&1
          SDK=/usr/local/lib/android/sdk
          AS=$(find "$SDK/build-tools" -name apksigner -type f | head -1)
          "$AS" sign --ks /tmp/ks --ks-pass pass:android \
            --key-pass pass:android \
            --out /tmp/ms.apk /tmp/module.apk 2>&1
      - name: Patch
        run: |
          java -jar /tmp/npatch.jar /tmp/official.apk \
            --embed /tmp/ms.apk -f -o /tmp/out
          cp /tmp/out/*.apk /tmp/final.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-clean
          path: /tmp/final.apk
          retention-days: 30
