name: LSPatch Fanqie APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: temurin

    - name: Download official APK
      run: curl -sL --max-time 300 "$URL" -o /tmp/official.apk
      env:
        URL: "https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0"

    - name: Download LSPatch JAR + module
      run: |
        curl -sL -o /tmp/lspatch.jar https://github.com/LSPosed/LSPatch/releases/download/v0.6/jar-v0.6-398-release.jar
        curl -sL -o /tmp/module.apk https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie-xposed-hook-v1.apk

    - name: LSPatch embed
      run: |
        java -jar /tmp/lspatch.jar /tmp/official.apk \
          -m /tmp/module.apk --embed -l 1 -d -f -o /tmp/out
        ls -lh /tmp/out/*.apk
        cp /tmp/out/*.apk /tmp/final.apk

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: fanqie-lspatched
        path: /tmp/final.apk
        retention-days: 30
