name: Build Clean Fanqie APK
on:
  workflow_dispatch:
    inputs:
      apk-official:
        description: APK asset name
        required: false
        default: fanqie_novel_official_7.2.4.32.apk
        type: string
      apk-mod:
        description: Modded APK asset name
        required: false
        default: fanqie_novel_7.2.4.19.apk
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        run: |
          BASE=https://github.com/${{ github.repository }}/releases/download/apk-assets
          curl -sL -o official.apk $BASE/${{ inputs.apk-official }}
          curl -sL -o modded.apk $BASE/${{ inputs.apk-mod }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decompile
        run: bash .github/scripts/decompile-apks.sh

      - name: Apply patches
        run: python3 .github/scripts/overlay-smali.py

      - name: Rebuild & sign
        run: bash .github/scripts/rebuild-and-sign.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-novel-patched
          path: patched.apk
          retention-days: 90
