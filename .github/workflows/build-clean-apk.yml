name: Build Clean APK
on:
  workflow_dispatch:
    inputs:
      delete_safe:
        description: 'Delete safe modules (widgets+alipay)'
        type: boolean
        default: true
      delete_tinker:
        description: 'Delete Tinker hot patch'
        type: boolean
        default: false
      clean_only:
        description: 'Only repack and sign, no deletion'
        type: boolean
        default: false
      binary_diff:
        description: 'Run binary diff (official vs modded .so + DEX)'
        type: boolean
        default: false
env:
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  APK_NAME: fanqie_novel_7.2.4.32.apk
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download official arm64 APK
        run: |
          curl -sL "$OFFICIAL_URL" -o /tmp/$APK_NAME -w "HTTP %{http_code}, size: %{size_download}\n"

      - name: Decode
        if: ${{ !inputs.clean_only }}
        run: |
          /opt/apktool d /tmp/$APK_NAME -o /tmp/base -f 2>&1 | tail -3

      - name: Delete safe modules
        if: ${{ inputs.delete_safe && !inputs.clean_only }}
        run: |
          cd /tmp/base
          for w in redpacket redpacketpattern welfaretask ecomorder coldstart; do
            find . -type d -name "$w" 2>/dev/null | while read d; do echo "DEL: $d"; rm -rf "$d"; done
          done
          for d in $(find . -type d -name 'alipay' -o -type d -name 'utdid2' 2>/dev/null); do
            c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
          done

      - name: Delete Tinker
        if: ${{ inputs.delete_tinker && !inputs.clean_only }}
        run: |
          cd /tmp/base
          find . -type d -name 'tinker' 2>/dev/null | while read d; do
            c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
          done

      - name: Build
        run: |
          if [ "${{ inputs.clean_only }}" = "true" ]; then
            # Skip decode/rebuild, sign original APK directly
            cp /tmp/$APK_NAME /tmp/unsigned.apk
          else
            /opt/apktool b /tmp/base -o /tmp/unsigned.apk 2>&1 | tail -5
          fi
          ls -lh /tmp/unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Clean, O=Clean, C=CN" 2>&1
          jarsigner -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore /tmp/debug.keystore -storepass android \
            /tmp/unsigned.apk debug 2>&1 | tail -3
          mv /tmp/unsigned.apk /tmp/clean.apk
          ls -lh /tmp/clean.apk && echo "SIGNED OK"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: clean-apk
          path: /tmp/clean.apk
          retention-days: 30

      - name: Binary diff (official vs modded)
        if: ${{ inputs.binary_diff }}
        run: |
          curl -sL "$MODDED_URL" -o /tmp/m.apk -w "MOD: HTTP %{http_code}, size: %{size_download}\n"
          echo "=== SIZE DIFF ==="
          unzip -l /tmp/$APK_NAME 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}' | sort > /tmp/oa.txt
          unzip -l /tmp/m.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}' | sort > /tmp/ma.txt
          join /tmp/oa.txt /tmp/ma.txt | awk '{d=$2-$3;d=d<0?-d:d}d>100{print $1" off="$2" mod="$3}'
          join -v2 /tmp/oa.txt /tmp/ma.txt | awk '{print "MODONLY: "$1}'
          join -v1 /tmp/oa.txt /tmp/ma.txt | awk '{print "OFFONLY: "$1}'
          echo "=== HEX DIFF ==="
          mkdir -p /tmp/ol /tmp/ml
          unzip -q /tmp/$APK_NAME 'lib/arm64-v8a/*.so' -d /tmp/ol
          unzip -q /tmp/m.apk 'lib/arm64-v8a/*.so' -d /tmp/ml
          cd /tmp/ol/lib/arm64-v8a
          for so in *.so; do
            mf="/tmp/ml/lib/arm64-v8a/$so"; [ ! -f "$mf" ] && continue
            s1=$(stat -c%s "$so"); s2=$(stat -c%s "$mf"); d=$((s1-s2)); d=${d#-}
            [ "$d" -le 100 ] && continue
            export FN="$so" FP="$mf" SZA="$s1" SZB="$s2"
            python3 << 'XEOF'
import os
so=os.environ['FN']
d1=open('/tmp/ol/lib/arm64-v8a/'+so,'rb').read()
d2=open(os.environ['FP'],'rb').read()
r=0
for i in range(0,min(len(d1),len(d2)),16):
    if d1[i:i+16]!=d2[i:i+16]:
        if r<8:
            a=' '.join('%02x'%b for b in d1[i:i+16])
            b=' '.join('%02x'%b for b in d2[i:i+16])
            sa=''.join(chr(b) if 32<=b<=126 else '.' for b in d1[i:i+16])
            sb=''.join(chr(b) if 32<=b<=126 else '.' for b in d2[i:i+16])
            print('@%05x'%i);print('O:'+a+' '+sa);print('M:'+b+' '+sb)
        r+=1
print(so+':'+str(r)+' off='+os.environ['SZA']+' mod='+os.environ['SZB'])
XEOF
          done
          echo "=== DEX HASH ==="
          python3 << 'XEOF'
import zipfile,hashlib
o=zipfile.ZipFile('/tmp/official.apk')
m=zipfile.ZipFile('/tmp/mod.apk')
seen=set()
for f in sorted(set(o.namelist())|set(m.namelist())):
    if not f.endswith('.dex') or f in seen: continue
    seen.add(f)
    od=o.read(f) if f in o.namelist() else None
    md=m.read(f) if f in m.namelist() else None
    if od and md:
        if hashlib.sha256(od).hexdigest()!=hashlib.sha256(md).hexdigest():
            print('DIFF:'+f+' off='+str(len(od))+' mod='+str(len(md)))
    elif od: print('OFFONLY:'+f+' ('+str(len(od))+')')
    elif md: print('MODONLY:'+f+' ('+str(len(md))+')')
XEOF
        uses: actions/upload-artifact@v4
        with:
          name: clean-apk
          path: /tmp/clean.apk
          retention-days: 30

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
