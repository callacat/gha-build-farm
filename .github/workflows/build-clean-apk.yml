name: Build Clean APK
on:
  workflow_dispatch:
    inputs:
      delete_safe:
        description: 'Delete safe modules (widgets+alipay)'
        type: boolean
        default: true
      delete_tinker:
        description: 'Delete Tinker hot patch'
        type: boolean
        default: false
      clean_only:
        description: 'Only repack and sign, no deletion'
        type: boolean
        default: false
env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  APK_NAME: fanqie_novel_7.2.4.32.apk
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download official arm64 APK
        run: |
          curl -sL "$OFFICIAL_URL" -o /tmp/$APK_NAME -w "HTTP %{http_code}, size: %{size_download}\n"

      - name: Decode
        if: ${{ !inputs.clean_only }}
        run: |
          /opt/apktool d /tmp/$APK_NAME -o /tmp/base -f 2>&1 | tail -3

      - name: Delete safe modules
        if: ${{ inputs.delete_safe && !inputs.clean_only }}
        run: |
          cd /tmp/base
          for w in redpacket redpacketpattern welfaretask ecomorder coldstart; do
            find . -type d -name "$w" 2>/dev/null | while read d; do echo "DEL: $d"; rm -rf "$d"; done
          done
          for d in $(find . -type d -name 'alipay' -o -type d -name 'utdid2' 2>/dev/null); do
            c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
          done

      - name: Delete Tinker
        if: ${{ inputs.delete_tinker && !inputs.clean_only }}
        run: |
          cd /tmp/base
          find . -type d -name 'tinker' 2>/dev/null | while read d; do
            c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
          done

      - name: Build
        run: |
          if [ "${{ inputs.clean_only }}" = "true" ]; then
            # Skip decode/rebuild, sign original APK directly
            cp /tmp/$APK_NAME /tmp/unsigned.apk
          else
            /opt/apktool b /tmp/base -o /tmp/unsigned.apk 2>&1 | tail -5
          fi
          ls -lh /tmp/unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Clean, O=Clean, C=CN" 2>&1
          jarsigner -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore /tmp/debug.keystore -storepass android \
            /tmp/unsigned.apk debug 2>&1 | tail -3
          mv /tmp/unsigned.apk /tmp/clean.apk
          ls -lh /tmp/clean.apk && echo "SIGNED OK"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: clean-apk
          path: /tmp/clean.apk
          retention-days: 30

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
