name: Build Clean APK
on:
  workflow_dispatch: {}
env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  APK_NAME: fanqie_novel_7.2.4.32.apk
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download official arm64 APK
        run: |
          curl -sL "$OFFICIAL_URL" -o /tmp/$APK_NAME -w "HTTP %{http_code}, size: %{size_download}\n"
          ls -lh /tmp/$APK_NAME
          unzip -l /tmp/$APK_NAME 'lib/*' 2>/dev/null | head -5

      - name: Upload official APK to release cache
        run: |
          gh release upload apk-assets "/tmp/$APK_NAME#official_$APK_NAME" \
            -R ${{ github.repository }} --clobber 2>/dev/null || true
          echo "Cached"

      - name: Decode
        run: |
          /opt/apktool d /tmp/$APK_NAME -o /tmp/base -f 2>&1 | tail -3
          echo "libs: $(find /tmp/base/lib -name '*.so' | wc -l)"
          find /tmp/base/lib -type d | sort
          echo "BEFORE=$(find /tmp/base -name '*.smali' | wc -l)" >> $GITHUB_ENV

      # Delete SDKs
      - name: Delete ad SDK
        run: |
          cd /tmp/base
          for dir in */com/bytedance/android/ad */com/pangle; do
            find . -type d -path "$dir" 2>/dev/null | while read d; do
              c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c files)"; rm -rf "$d"
            done
          done

      - name: Delete LuckyCat
        run: |
          cd /tmp/base
          find . -type d -name 'luckycat' -o -type d -name 'luckydog' 2>/dev/null | while read d; do
            c=$(find "$d" -type f | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
          done

      - name: Delete push + tracking + Tinker + Alipay
        run: |
          cd /tmp/base
          for path in push deviceregister mannor agilelogger message tinker downloadlib alipay; do
            find . -type d -name "$path" 2>/dev/null | while read d; do
              c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
            done
          done

      - name: Delete widgets
        run: |
          cd /tmp/base
          for w in redpacket redpacketpattern welfaretask ecomorder coldstart; do
            find . -type d -name "$w" 2>/dev/null | while read d; do echo "DEL: $d"; rm -rf "$d"; done
          done

      - name: Summary
        run: |
          echo "Before: $BEFORE smali files"
          echo "After: $(find /tmp/base -name '*.smali' | wc -l) smali files"

      - name: Build
        run: |
          /opt/apktool b /tmp/base -o /tmp/unsigned.apk 2>&1 | tail -5
          ls -lh /tmp/unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Clean, O=Clean, C=CN" 2>&1
          jarsigner -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore /tmp/debug.keystore -storepass android \
            /tmp/unsigned.apk debug 2>&1 | tail -3
          mv /tmp/unsigned.apk /tmp/clean.apk
          ls -lh /tmp/clean.apk && echo "SIGNED OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clean-apk-v3
          path: /tmp/clean.apk
          retention-days: 30

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
