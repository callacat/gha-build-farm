name: Build Clean APK
on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'APK file name'
        required: false
        default: 'novelapp_45466779a_v1327_72432_72432_d367_1781612828.apk'

env:
  OFFICIAL_URL: https://lf9-apk.ugapk.cn/package/apk/novelapp/1327_72432_72432/15/novelapp_45466779a_v1327_72432_72432_d367_1781612828.apk?v=1781612834
  APK_NAME: ${{ inputs.apk_name }}

jobs:
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.upload.outputs.artifact }}
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download official APK
        run: |
          # Check release cache first
          if gh release download apk-assets -p "official_$APK_NAME" -R ${{ github.repository }} --dir /tmp 2>/dev/null; then
            echo "Downloaded from release cache"
            mv /tmp/official_$APK_NAME /tmp/$APK_NAME
          else
            curl -sL "$OFFICIAL_URL" -o /tmp/$APK_NAME -w "HTTP %{http_code}, size: %{size_download}\n"
            # Cache for next run (best effort)
            gh release upload apk-assets "/tmp/$APK_NAME#official_$APK_NAME" \
              -R ${{ github.repository }} --clobber 2>/dev/null || true
          fi
          ls -lh /tmp/$APK_NAME

      - name: Decode official APK
        run: |
          /opt/apktool d /tmp/$APK_NAME -o /tmp/base -f 2>&1 | tail -5
          echo "Smali files: $(find /tmp/base -name '*.smali' | wc -l)"

      # ── Phase 1: Manifest cleanup ──
      # ponytail: skip permission stripping for now — permissions are just
      # declarations. Code that uses them is already deleted in Phase 2.
      # Add perms back when manifest-only break is confirmed.

      # ── Phase 2: Delete SDK directories ──
      - name: Count files before deletion
        run: |
          echo "BEFORE_DELETION=$(find /tmp/base -name '*.smali' | wc -l)" >> $GITHUB_ENV

      - name: Delete ad SDK directories
        run: |
          cd /tmp/base
          # Delete all bytedance ad SDK files across smali_classes* dirs
          # Use direct path patterns that match the actual directory structure
          echo "=== FINDING AD SDK DIRECTORIES ==="
          find . -type d -path '*/com/bytedance/android/ad' 2>/dev/null | while read d; do
            COUNT=$(find "$d" -type f 2>/dev/null | wc -l)
            echo "DELETING: $d ($COUNT files)"
            rm -rf "$d"
          done
          # Also remove other known ad-related paths
          find . -type d -path '*/com/pangle*' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/bytedance/sdk/open' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete LuckyCat directory
        run: |
          cd /tmp/base
          find . -type d -path '*/com/bytedance/ug/sdk/luckycat' 2>/dev/null | while read d; do
            echo "DELETING: $d ($(find "$d" -type f 2>/dev/null | wc -l) files)"
            rm -rf "$d"
          done
          find . -type d -path '*/com/bytedance/ug/sdk/luckydog' 2>/dev/null | while read d; do
            echo "DELETING: $d ($(find "$d" -type f 2>/dev/null | wc -l) files)"
            rm -rf "$d"
          done

      - name: Delete push alliance
        run: |
          cd /tmp/base
          find . -type d -path '*/com/bytedance/push' 2>/dev/null | while read d; do
            echo "DELETING: $d ($(find "$d" -type f 2>/dev/null | wc -l) files)"
            rm -rf "$d"
          done
          find . -type d -path '*/com/ss/android/message' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete device register & tracking
        run: |
          cd /tmp/base
          find . -type d -path '*/com/ss/android/deviceregister' 2>/dev/null | while read d; do
            echo "DELETING: $d ($(find "$d" -type f 2>/dev/null | wc -l) files)"
            rm -rf "$d"
          done
          find . -type d -path '*/com/ss/android/agilelogger' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          # OAID / deviceid helpers
          find . -type d -path '*/com/bytedance/ss/a/a' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete monitor/collector
        run: |
          cd /tmp/base
          find . -type d -path '*/com/ss/android/mannor' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/ss/android/bd' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete vendor push libs
        run: |
          cd /tmp/base
          for dir in xiaomi huawei honor vivo oppo heytop; do
            find . -type d -path "*/push.sdk.$dir" -o -path "*/push/$dir" 2>/dev/null | while read d; do
              echo "DELETING: $d"
              rm -rf "$d"
            done
          done

      - name: Delete Tinker (hot patch)
        run: |
          cd /tmp/base
          find . -type d -path '*/com/tencent/tinker' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete downloader
        run: |
          cd /tmp/base
          find . -type d -path '*/com/ss/android/downloadlib' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/ss/android/downloader' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete Alipay SDK
        run: |
          cd /tmp/base
          find . -type d -path '*/com/alipay' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/ta/utdid2' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Delete RedPacket / ColdStart widgets
        run: |
          cd /tmp/base
          find . -type d -path '*/com/dragon/read/appwidget/redpacket' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/dragon/read/appwidget/redpacketpattern' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/dragon/read/appwidget/welfaretask' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/dragon/read/coldstart' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done
          find . -type d -path '*/com/dragon/read/appwidget/ecomorder' 2>/dev/null | while read d; do
            echo "DELETING: $d"
            rm -rf "$d"
          done

      - name: Summary of deleted files
        run: |
          echo "=== BEFORE/AFTER ==="
          echo "Before: $BEFORE_DELETION smali files"
          echo "After: $(find /tmp/base -name '*.smali' | wc -l) smali files"

      # ── Phase 3: Build ──
      - name: Rebuild APK
        run: |
          cd /tmp
          # Rebuild with apktool
          /opt/apktool b /tmp/base -o /tmp/unsigned.apk 2>&1 | tail -10
          ls -lh /tmp/unsigned.apk

      - name: Generate test keystore and sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CleanNovel, O=CleanNovel, C=CN" 2>&1
          # Sign with jarsigner (works everywhere)
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore /tmp/debug.keystore -storepass android \
            /tmp/unsigned.apk debug 2>&1 | tail -5
          mv /tmp/unsigned.apk /tmp/clean.apk
          ls -lh /tmp/clean.apk
          echo "SIGNED OK"

      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: clean-apk-v1
          path: /tmp/clean.apk
          retention-days: 30

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
