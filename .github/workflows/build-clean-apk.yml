name: Build Clean APK
on:
  workflow_dispatch: {}
env:
  BASE_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
  APK_NAME: fanqie_novel_7.2.4.19.apk
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download modded APK (has arm64 libs)
        run: |
          curl -sL "$BASE_URL" -o /tmp/$APK_NAME -w "HTTP %{http_code}, size: %{size_download}\n"
          ls -lh /tmp/$APK_NAME

      - name: Decode
        run: |
          /opt/apktool d /tmp/$APK_NAME -o /tmp/base -f 2>&1 | tail -3
          echo "libs: $(find /tmp/base/lib -name '*.so' | wc -l) total"
          echo "arm64: $(ls /tmp/base/lib/arm64-v8a/*.so 2>/dev/null | wc -l)"
          echo "smali: $(find /tmp/base -name '*.smali' | wc -l)" >> $GITHUB_ENV
          echo "BEFORE=$(find /tmp/base -name '*.smali' | wc -l)" >> $GITHUB_ENV

      - name: Restore official appComponentFactory
        run: |
          cd /tmp/base
          sed -i 's/android:appComponentFactory="[^"]*"/android:appComponentFactory="androidx.core.app.CoreComponentFactory"/' AndroidManifest.xml
          echo "appComponentFactory restored"

      # Delete SDKs
      - name: Delete ad SDK
        run: |
          cd /tmp/base
          for dir in */com/bytedance/android/ad */com/pangle; do
            find . -type d -path "$dir" 2>/dev/null | while read d; do
              c=$(find "$d" -type f | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
            done
          done

      - name: Delete LuckyCat
        run: |
          cd /tmp/base
          find . -type d -path '*/com/bytedance/ug/sdk/luckycat' -o -path '*/com/bytedance/ug/sdk/luckydog' 2>/dev/null | while read d; do
            c=$(find "$d" -type f | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
          done

      - name: Delete push + device register + tracking
        run: |
          cd /tmp/base
          for path in */com/bytedance/push */com/ss/android/message */com/ss/android/deviceregister */com/ss/android/mannor */com/ss/android/agilelogger */com/tencent/tinker */com/ss/android/downloadlib */com/alipay; do
            find . -type d -path "$path" 2>/dev/null | while read d; do
              c=$(find "$d" -type f 2>/dev/null | wc -l); echo "DEL: $d ($c)"; rm -rf "$d"
            done
          done

      - name: Delete widgets
        run: |
          cd /tmp/base
          for path in */com/dragon/read/appwidget/redpacket */com/dragon/read/appwidget/redpacketpattern */com/dragon/read/appwidget/welfaretask */com/dragon/read/coldstart */com/dragon/read/appwidget/ecomorder; do
            find . -type d -path "$path" 2>/dev/null | while read d; do
              echo "DEL: $d"; rm -rf "$d"
            done
          done
          echo "After: $(find . -name '*.smali' | wc -l)"

      - name: Build
        run: |
          /opt/apktool b /tmp/base -o /tmp/unsigned.apk 2>&1 | tail -5
          ls -lh /tmp/unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Clean, O=Clean, C=CN" 2>&1
          jarsigner -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore /tmp/debug.keystore -storepass android \
            /tmp/unsigned.apk debug 2>&1 | tail -3
          mv /tmp/unsigned.apk /tmp/clean.apk
          ls -lh /tmp/clean.apk && echo "SIGNED OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clean-apk-v2
          path: /tmp/clean.apk
          retention-days: 30

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
