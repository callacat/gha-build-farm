name: Build Clean APK
on:
  workflow_dispatch: {}
env:
  OURL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  MURL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
  APK: fanqie_novel_7.2.4.32.apk
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar

      - run: curl -sL "$OURL" -o /tmp/$APK -w "size: %{size_download}\n"

      - run: /opt/apktool d /tmp/$APK -o /tmp/base -f 2>&1 | tail -1

      - run: curl -sL "$MURL" -o /tmp/m.apk -w "MOD: %{size_download}\n"

      - run: |
          echo "=== LIB SIZE DIFF ==="
          unzip -l /tmp/$APK 'lib/arm64-v8a/*.so' | awk '/\.so/{print $4,$1}' | sort > /tmp/a.txt
          unzip -l /tmp/m.apk 'lib/arm64-v8a/*.so' | awk '/\.so/{print $4,$1}' | sort > /tmp/b.txt
          join /tmp/a.txt /tmp/b.txt | awk '{d=$2-$3;d=d<0?-d:d}d>100{print"DIFF: "$1" off="$2" mod="$3}'
          echo "MOD-ONLY:"; join -v2 /tmp/a.txt /tmp/b.txt
          echo "OFF-ONLY:"; join -v1 /tmp/a.txt /tmp/b.txt

      - run: |
          mkdir -p /tmp/ol /tmp/ml
          unzip -q /tmp/$APK 'lib/arm64-v8a/*.so' -d /tmp/ol
          unzip -q /tmp/m.apk 'lib/arm64-v8a/*.so' -d /tmp/ml
          cd /tmp/ol/lib/arm64-v8a
          for so in *.so; do
            mf="/tmp/ml/lib/arm64-v8a/$so"; [ ! -f "$mf" ] && continue
            s1=$(stat -c%s "$so"); s2=$(stat -c%s "$mf"); d=$((s1-s2)); d=${d#-}
            [ "$d" -le 100 ] && continue
            export FN="$so" FP="$mf" S1="$s1" S2="$s2"
            python3 -c "import os,binascii
d1=open('/tmp/ol/lib/arm64-v8a/'+os.environ['FN'],'rb').read()
d2=open(os.environ['FP'],'rb').read()
n=0
for i in range(0,min(len(d1),len(d2)),16):
    if d1[i:i+16]!=d2[i:i+16]:
        if n<8:
            a=' '.join('%02x'%b for b in d1[i:i+16]); b=' '.join('%02x'%b for b in d2[i:i+16])
            sa=''.join(chr(b) if 32<=b<=126 else '.' for b in d1[i:i+16])
            sb=''.join(chr(b) if 32<=b<=126 else '.' for b in d2[i:i+16])
            print('@%05x'%i);print('O:'+a+' '+sa);print('M:'+b+' '+sb)
        n+=1
print(os.environ['FN']+': '+str(n)+' diff off='+os.environ['S1']+' mod='+os.environ['S2'])"
          done

      - run: |
          python3 -c "import zipfile,hashlib
o=zipfile.ZipFile('/tmp/$APK'); m=zipfile.ZipFile('/tmp/m.apk')
for f in sorted(set(o.namelist())|set(m.namelist())):
    if not f.endswith('.dex'): continue
    od=o.read(f) if f in o.namelist() else None; md=m.read(f) if f in m.namelist() else None
    if od and md:
        if hashlib.sha256(od).hexdigest()!=hashlib.sha256(md).hexdigest():
            print('DEXDIFF:'+f+' off='+str(len(od))+' mod='+str(len(md)))
    elif od: print('DEXOFF:'+f)
    elif md: print('DEXMOD:'+f)"

      - uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
