name: Build Overlay Fanqie APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        run: |
          RELEASE_URL="https://github.com/callacat/gha-build-farm/releases/download/apk-assets"
          curl -sL -o official.apk "$RELEASE_URL/fanqie_novel_official_7.2.4.32.apk"
          curl -sL -o modded.apk "$RELEASE_URL/fanqie_novel_7.2.4.19.apk"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool 3.0.2
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar

      - name: Decompile official
        run: java -jar apktool.jar d -f official.apk -o official_smali

      - name: Decompile modded
        run: java -jar apktool.jar d -f modded.apk -o modded_smali

      - name: Overlay
        run: |
          python3 << 'PYEOF'
import os, shutil
mod, off = 'modded_smali', 'official_smali'
for item in sorted(os.listdir(mod)):
    src, dst = os.path.join(mod, item), os.path.join(off, item)
    if item == 'original' or not os.path.isdir(src):
        continue
    if item.startswith('smali'):
        print(f'Overlay {item}...')
        if os.path.exists(dst):
            shutil.rmtree(dst)
        shutil.copytree(src, dst)
shutil.copy2(os.path.join(mod, 'AndroidManifest.xml'), os.path.join(off, 'AndroidManifest.xml'))
print('DONE')
PYEOF

      - name: Rebuild
        run: java -jar apktool.jar b official_smali -o unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey             -storepass android -keypass android -keyalg RSA -keysize 2048             -validity 10000 -dname "CN=Debug, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android             --ks-key-alias androiddebugkey --out patched.apk unsigned.apk
          ls -lh patched.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-overlay-patched
          path: patched.apk
          retention-days: 90
