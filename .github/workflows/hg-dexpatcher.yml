name: HG Route 3 — DexPatcher Test
run-name: ${{ inputs.app_id || 'hg' }} dexpatcher-helloworld

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: '应用ID (hg/fq)'
        required: true
        default: 'hg'
      apk_url:
        description: 'APK 下载地址（留空用 release cache）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Fetch APK (URL or release cache)
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ID="${{ inputs.app_id }}"
          APK_URL="${{ inputs.apk_url }}"
          SDK=/usr/local/lib/android/sdk
          [ -d "$SDK" ] || SDK=$ANDROID_HOME
          BADGING=$(find "$SDK" -name aapt2 2>/dev/null | head -1)

          fetch_apk() {
            local src="$1" out="$2"
            if [ -n "$APK_URL" ]; then
              curl -sL --max-time 300 "$APK_URL" -o "$out"
            fi
            if [ ! -s "$out" ]; then
              CACHE_TAG=$(gh release list --repo ${{ github.repository }} -L 30 --json tagName \
                | python3 -c "import sys,json;rels=json.load(sys.stdin);tags=[r['tagName'] for r in rels if r['tagName'].startswith('$ID-original-')];print(max(tags) if tags else '')")
              if [ -n "$CACHE_TAG" ]; then
                echo "📦 Using release cache: $CACHE_TAG"
                gh release download "$CACHE_TAG" --repo ${{ github.repository }} --pattern "*.apk" --dir /tmp --clobber
                mv /tmp/*.apk "$out" 2>/dev/null || true
              fi
            fi
            if [ ! -s "$out" ]; then echo "❌ No APK available"; exit 1; fi
            local size=$(stat -c%s "$out")
            echo "APK size: $size bytes"
            if [ -n "$BADGING" ]; then
              local ver=$($BADGING dump badging "$out" 2>/dev/null | grep -oP "versionName='[^']+'" | sed "s/versionName='//;s/'//")
              echo "APK version: ${ver:-unknown}"
            fi
          }

          fetch_apk "$APK_URL" /tmp/target.apk

      - name: 🛠️ Run DexPatcher HelloWorld build
        shell: bash
        run: |
          bash dexpatcher-patches/build.sh /tmp/target.apk /tmp/patched.apk

      - name: 🛠️ Sign patched APK
        run: |
          SDK=/usr/local/lib/android/sdk
          [ -d "$SDK" ] || SDK=$ANDROID_HOME
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d | sort -Vr | head -1)

          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null

          zip -d /tmp/patched.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' 2>/dev/null || true
          $BT/zipalign -v -p 4 /tmp/patched.apk /tmp/aligned.apk 2>&1 | tail -2
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/signed.apk /tmp/aligned.apk 2>&1 | tail -5
          $BT/apksigner verify --verbose /tmp/signed.apk 2>&1 | head -10

      - name: ✅ Verify patch applied
        shell: bash
        run: |
          SDK=/usr/local/lib/android/sdk
          [ -d "$SDK" ] || SDK=$ANDROID_HOME
          AAPT2=$(find "$SDK/build-tools" -name aapt2 2>/dev/null | head -1)

          echo "=== Patched APK info ==="
          ls -lh /tmp/signed.apk

          # Dump resources to verify no corruption
          if [ -n "$AAPT2" ]; then
            $AAPT2 dump resources /tmp/signed.apk 2>&1 | head -5 || echo "(aapt2 dump skipped)"
          fi

          # Extract and check if our patch file exists
          unzip -l /tmp/signed.apk | grep -i "MuteApplication\|classes.*dex" | head -10 || true
          echo ""
          echo "✅ Build complete. Download to phone and install to verify Toast."

      - name: 📤 Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hg-dexpatcher-helloworld
          path: /tmp/signed.apk
          retention-days: 7

      - name: 📤 Upload to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          APK_NAME="hg-dexpatcher-test-b${{ github.run_number }}.apk"
          cp /tmp/signed.apk "/tmp/$APK_NAME"

          rm -f /tmp/release-notes.md
          echo "**DexPatcher HelloWorld Test**" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**目标:** 验证 DexPatcher 链路是否通畅" >> /tmp/release-notes.md
          echo "**修改:** MuteApplicationStub.onCreate() → Toast 弹窗" >> /tmp/release-notes.md
          echo "**构建时间:** $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> /tmp/release-notes.md
          echo "**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**下载：**" >> /tmp/release-notes.md
          echo "- 直链: https://github.com/${{ github.repository }}/releases/download/hg-dexpatcher-latest/$APK_NAME" >> /tmp/release-notes.md

          gh release delete "hg-dexpatcher-latest" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "hg-dexpatcher-latest" 2>/dev/null || true
          gh release create "hg-dexpatcher-latest" \
            --repo ${{ github.repository }} \
            --title "DexPatcher HelloWorld Test (latest)" \
            --notes-file /tmp/release-notes.md \
            "/tmp/$APK_NAME"

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ DexPatcher HelloWorld 构建成功\n$RUN_URL\nhttps://github.com/${{ github.repository }}/releases/download/hg-dexpatcher-latest/hg-dexpatcher-test-b${{ github.run_number }}.apk"
          else
            MSG="❌ DexPatcher HelloWorld 构建失败\n$RUN_URL"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" || true
