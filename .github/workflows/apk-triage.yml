name: APK Triage

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK download URL (used only if not in Release cache)'
        required: true
        type: string
      apk_name:
        description: 'APK file name (optional)'
        required: false
        type: string
        default: 'target.apk'

concurrency:
  group: apk-triage-${{ github.actor }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          echo '#!/bin/bash' > /opt/apktool
          echo 'java -jar /opt/apktool.jar "$@"' >> /opt/apktool
          chmod +x /opt/apktool

      - name: Download APK (release cache or external)
        id: dl
        run: |
          # First try release cache (gh auth with GITHUB_TOKEN works on runner)
          if gh release download apk-assets -p "${{ inputs.apk_name }}" -R ${{ github.repository }} --dir /tmp 2>/dev/null; then
            echo "Downloaded from release cache"
            echo "source=release" >> "$GITHUB_OUTPUT"
          else
            echo "Not in release cache, downloading from URL"
            curl -sL "${{ inputs.apk_url }}" -o /tmp/${{ inputs.apk_name }}
            echo "source=external" >> "$GITHUB_OUTPUT"
          fi
          ls -lh /tmp/${{ inputs.apk_name }}

      - name: Upload APK to release cache (if from external)
        if: steps.dl.outputs.source == 'external'
        run: |
          # gh CLI works on runner with GITHUB_TOKEN
          gh release view apk-assets -R ${{ github.repository }} 2>/dev/null || \
            gh release create apk-assets -R ${{ github.repository }} \
              --title "APK Assets" --notes "APK download cache" 2>/dev/null
          gh release upload apk-assets "/tmp/${{ inputs.apk_name }}#${{ inputs.apk_name }}" \
            -R ${{ github.repository }} --clobber 2>&1
          echo "APK cached to release"

      - name: apktool decode
        run: |
          /opt/apktool d /tmp/${{ inputs.apk_name }} -o /tmp/apktool_out -f 2>&1

      - name: jadx decompile (single-pass, single-threaded)
        run: |
          mkdir -p /tmp/jadx_out
          JADX_OPTS="-Xmx5g" timeout 1800 /opt/jadx/bin/jadx \
            --jobs 1 \
            -d /tmp/jadx_out \
            /tmp/${{ inputs.apk_name }} 2>&1 || echo "jadx: timed out or failed, continuing"

      - name: Generate triage summary
        run: |
          {
            echo "=== APK Triage Summary ==="
            echo "APK: ${{ inputs.apk_name }}"
            echo "Size: $(ls -lh /tmp/${{ inputs.apk_name }} | awk '{print $5}')"
            echo ""
            echo "=== Manifest ==="
            grep -E 'package=|<activity|<service|<receiver|<provider' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | head -60
            echo ""
            echo "=== Permissions ==="
            grep 'uses-permission' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | sed 's/.*android:name="//;s/".*//'
            echo ""
            echo "=== Native libs ==="
            find /tmp/apktool_out/lib -name '*.so' 2>/dev/null | sort
            echo ""
            echo "=== jadx output ==="
            if [ -d /tmp/jadx_out ]; then
              echo "Top-level packages:"
              ls /tmp/jadx_out/ 2>/dev/null | head -40
              echo ""
              echo "Java files: $(find /tmp/jadx_out -name '*.java' 2>/dev/null | wc -l)"
            else
              echo "jadx_out not available"
            fi
          } > /tmp/triage-summary.md
          cat /tmp/triage-summary.md

      - name: Package and upload
        run: |
          cd /tmp
          tar czf apk-triage-output.tar.gz \
            --exclude='*.png' --exclude='*.jpg' --exclude='*.gif' \
            jadx_out/ apktool_out/ triage-summary.md 2>/dev/null || \
          tar czf apk-triage-output.tar.gz apktool_out/ triage-summary.md
          ls -lh apk-triage-output.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-triage-output
          path: /tmp/apk-triage-output.tar.gz
          retention-days: 7

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 3
