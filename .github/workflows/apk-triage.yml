name: APK Triage

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK download URL'
        required: true
        type: string
      apk_name:
        description: 'APK file name (optional)'
        required: false
        type: string
        default: 'target.apk'

concurrency:
  group: apk-triage-${{ github.actor }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          echo '#!/bin/bash' > /opt/apktool
          echo 'java -jar /opt/apktool.jar "$@"' >> /opt/apktool
          chmod +x /opt/apktool

      - name: Download APK
        run: |
          curl -sL "${{ inputs.apk_url }}" -o /tmp/${{ inputs.apk_name }}
          ls -lh /tmp/${{ inputs.apk_name }}

      - name: apktool decode
        run: |
          /opt/apktool d /tmp/${{ inputs.apk_name }} -o /tmp/apktool_out -f 2>&1

      - name: jadx decompile (per-dex, skip hanging)
        run: |
          mkdir -p /tmp/jadx_out
          cd /tmp
          # extract all dex files
          unzip -o ${{ inputs.apk_name }} 'classes*.dex' -d /tmp/dex_temp/ 2>/dev/null
          DEXES=$(find /tmp/dex_temp -name 'classes*.dex' | sort)
          DEX_COUNT=$(echo "$DEXES" | wc -l)
          echo "Found $DEX_COUNT dex files"
          SUCCESS=0
          SKIP=0
          for dex in $DEXES; do
            DEX_NAME=$(basename "$dex")
            echo "=== Processing: $DEX_NAME ==="
            OUT_DIR="/tmp/jadx_${DEX_NAME%.dex}"
            mkdir -p "$OUT_DIR"
            if JADX_OPTS="-Xmx4g" timeout 120 /opt/jadx/bin/jadx -d "$OUT_DIR" "$dex" 2>&1; then
              # merge into jadx_out
              rsync -a "$OUT_DIR/" /tmp/jadx_out/ 2>/dev/null || cp -rn "$OUT_DIR/"* /tmp/jadx_out/ 2>/dev/null || true
              SUCCESS=$((SUCCESS+1))
              echo "  ✅ $DEX_NAME decompiled successfully"
            else
              SKIP=$((SKIP+1))
              echo "  ⏭️ $DEX_NAME skipped (timeout or error)"
            fi
          done
          echo "=== jadx: $SUCCESS/$DEX_COUNT dex files done, $SKIP skipped ==="

      - name: Generate triage summary
        run: |
          {
            echo "=== APK Triage Summary ==="
            echo "APK: ${{ inputs.apk_name }}"
            echo "Size: $(ls -lh /tmp/${{ inputs.apk_name }} | awk '{print $5}')"
            echo ""
            echo "=== Manifest ==="
            grep -E 'package=|<activity|<service|<receiver|<provider' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | head -60
            echo ""
            echo "=== Permissions ==="
            grep 'uses-permission' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | sed 's/.*android:name="//;s/".*//'
            echo ""
            echo "=== Native libs ==="
            find /tmp/apktool_out/lib -name '*.so' 2>/dev/null | sort
            echo ""
            echo "=== jadx output ==="
            if [ -d /tmp/jadx_out ]; then
              echo "Top-level packages:"
              ls /tmp/jadx_out/ 2>/dev/null | head -40
              echo ""
              echo "Java files: $(find /tmp/jadx_out -name '*.java' 2>/dev/null | wc -l)"
            else
              echo "jadx_out not available"
            fi
          } > /tmp/triage-summary.md
          cat /tmp/triage-summary.md

      - name: Package and upload
        run: |
          cd /tmp
          tar czf apk-triage-output.tar.gz \
            --exclude='*.png' --exclude='*.jpg' --exclude='*.gif' \
            jadx_out/ apktool_out/ triage-summary.md 2>/dev/null || \
          tar czf apk-triage-output.tar.gz apktool_out/ triage-summary.md
          ls -lh apk-triage-output.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-triage-output
          path: /tmp/apk-triage-output.tar.gz
          retention-days: 7

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 3
