name: APK Triage
on:
  workflow_dispatch:
    inputs:
      apk-url:
        description: APK URL to triage
        required: false
        default: ''
        type: string
jobs:
  triage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download APK
        env:
          BASE: https://github.com/${{ github.repository }}/releases/download/apk-assets
          DEFAULT_APK: fanqie_novel_official_7.2.4.32.apk
        run: |
          URL="${{ inputs.apk-url }}"
          if [ -z "$URL" ]; then URL="$BASE/$DEFAULT_APK"; fi
          curl -sL -o app.apk "$URL" -w "HTTP %{http_code}, %{size_download}B\n"
      - name: Install jadx
        run: |
          curl -sL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d /opt/jadx
          echo "/opt/jadx/bin" >> $GITHUB_PATH
      - name: jadx decompile
        run: |
          jadx --show-bad-code -d /tmp/jadx-output app.apk 2>&1 | tail -5
      - name: apktool unpack
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar apktool.jar d -f app.apk -o /tmp/apktool-output 2>&1 | tail -3
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: triage-output
          path: /tmp/jadx-output
          retention-days: 7

      - name: Clean old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 10
