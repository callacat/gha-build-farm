name: APK Triage
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK download URL (fallback)'
        required: false
        type: string
        default: ''
      apk_name:
        description: 'APK file name'
        required: false
        type: string
        default: 'target.apk'

concurrency:
  group: apk-triage-${{ github.actor }}
  cancel-in-progress: true

env:
  APK_DL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
  APK_NAME: fanqie_novel_7.2.4.19.apk

jobs:
  triage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download APK (public release asset)
        run: curl -sL "$APK_DL" -o /tmp/$APK_NAME && ls -lh /tmp/$APK_NAME

      - name: apktool decode
        run: timeout 300 /opt/apktool d /tmp/$APK_NAME -o /tmp/apktool_out -f 2>&1 || true

      - name: Generate manifest
        run: |
          echo "=== APK: $APK_NAME ==="
          echo "Size: $(ls -lh /tmp/$APK_NAME | awk '{print $5}')"
          echo ""
          grep -E 'package=|<activity|<service|<receiver|<provider' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | head -60
          echo ""
          grep 'uses-permission' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | sed 's/.*android:name="//;s/".*//'
          echo ""
          find /tmp/apktool_out/lib -name '*.so' 2>/dev/null | sort | head -30

      - name: jadx (single-thread, 5g)
        run: |
          mkdir -p /tmp/jadx_out
          JADX_OPTS="-Xmx5g" timeout 1500 /opt/jadx/bin/jadx -j 1 -d /tmp/jadx_out /tmp/$APK_NAME 2>&1 || echo "jadx: failed/timed out"
          echo "Java files: $(find /tmp/jadx_out -name '*.java' 2>/dev/null | wc -l)"
          ls /tmp/jadx_out/ 2>/dev/null | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: triage-output
          path: |
            /tmp/jadx_out/
            /tmp/apktool_out/
          compression-level: 3
          retention-days: 7

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
