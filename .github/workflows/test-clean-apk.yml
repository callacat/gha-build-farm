name: Test Clean APK
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build run ID (leave empty for latest)'
        required: false
        default: ''
  workflow_run:
    workflows: ['Build Clean APK']
    types: [completed]

jobs:
  emulator-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Install tools
        run: |
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Determine build run ID
        id: runid
        run: |
          if [ -n "${{ inputs.build_run_id }}" ]; then
            RID="${{ inputs.build_run_id }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          else
            RID=$(gh run list -R ${{ github.repository }} -w "Build Clean APK" \
              --json 'databaseId,conclusion' --jq '.[] | select(.conclusion=="success") | .databaseId' | head -1)
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: clean-apk*
          path: /tmp/apk
          merge-multiple: true
          run-id: ${{ steps.runid.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Find APK
        id: apk
        run: |
          ls -lh /tmp/apk/
          APK=$(find /tmp/apk -name '*.apk' | head -1)
          echo "Found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Check APK exists
        if: steps.apk.outputs.path == ''
        run: |
          echo "No APK found!"
          ls -la /tmp/apk/ || true
          exit 1

      - name: Setup Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -noaudio -memory 2048
          disable-animations: true
          script: |
            echo "=== Install APK ==="
            adb install -r "${{ steps.apk.outputs.path }}"
            echo "EXIT: $?"

            echo "=== Launch ==="
            adb shell am start -n com.dragon.read/.pages.splash.SplashActivity
            sleep 8

            echo "=== Check ==="
            adb shell dumpsys window windows 2>/dev/null | grep 'mCurrentFocus\|mFocusedApp' | head -3
            adb logcat -d -s AndroidRuntime "*:E" 2>/dev/null | head -15

            echo "=== Screenshot ==="
            adb exec-out screencap -p > /tmp/screenshot.png || true
            ls -lh /tmp/screenshot.png && echo "SCREENSHOT_OK" || echo "SCREENSHOT_FAILED"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshot
          path: /tmp/screenshot.png
          retention-days: 7

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
