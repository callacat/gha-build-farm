name: Check Native Libs & DEX Diff
on:
  workflow_dispatch: {}

env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk

jobs:
  diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - run: curl -sL "$OFFICIAL_URL" -o official.apk -w "O: HTTP %{http_code}, %{size_download}B\n"
      - run: curl -sL "$MODDED_URL" -o modded.apk -w "M: HTTP %{http_code}, %{size_download}B\n"

      - name: Native lib comparison
        run: python3 .github/scripts/native-lib-diff.py

      - name: DEX hash comparison
        run: python3 .github/scripts/dex-hash-diff.py

      - name: Clean old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
