name: Learn Mod APK — Analyze Modder's Techniques
on:
  workflow_dispatch: {}
env:
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
jobs:
  learn:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download modded APK
        run: |
          curl -sL "$MODDED_URL" -o /tmp/mod.apk -w "HTTP %{http_code}, size: %{size_download}\n"

      - name: Decode with apktool
        run: |
          /opt/apktool d /tmp/mod.apk -o /tmp/mod -f 2>&1 | tail -1

      - name: 1. Analyze AppFactory hook mechanism
        run: |
          echo "=== AppFactory.onCreate flow ==="
          grep -n 'instantiateActivity\|instantiateService\|instantiateReceiver\|instantiateProvider\|onCreate' $(find /tmp/mod -path '*/pandora/core/AppFactory.smali') 2>/dev/null | head -30
          echo ""
          echo "=== AppFactory field references ==="
          grep -n 'sget-object\|sput-object\|iget\|iput' $(find /tmp/mod -path '*/pandora/core/AppFactory.smali') 2>/dev/null | grep -i 'signature\|package\|apkPath\|dataDir\|repPath' | head -20

      - name: 2. Analyze CreatorProxy (signature spoof)
        run: |
          F=$(find /tmp/mod -path '*/pandora/core/CreatorProxy.smali')
          echo "=== CreatorProxy methods ==="
          grep -n '\.method' "$F" 2>/dev/null | head -20
          echo ""
          echo "=== CreatorProxy createFromParcel ==="
          egrep -A5 'createFromParcel|newArray|PackageInfo|signature' "$F" 2>/dev/null | head -40

      - name: 3. ShadowHook configuration
        run: |
          echo "=== ShadowHook Init ==="
          cat $(find /tmp/mod -path '*/shadowhook/Init.smali' 2>/dev/null | head -1) 2>/dev/null | head -80

      - name: 4. Native method bridge (J/N.smali)
        run: |
          F=$(find /tmp/mod -name 'N.smali' -path '*/J/*' 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            echo "=== J/N.smali ($(wc -l < "$F") lines) ==="
            head -40 "$F"
            echo "..."
            tail -40 "$F"
          fi

      - name: 5. ActivityThread modifications
        run: |
          F=$(find /tmp/mod -name 'ActivityThread.smali' -path '*/android/app/*' 2>/dev/null | head -1)
          echo "=== ActivityThread ($(wc -l < "$F") lines) ==="
          cat "$F"

      - name: 6. getPackageInfo hook (zo4/b)
        run: |
          F=$(find /tmp/mod -name 'b.smali' -path '*/zo4/*' 2>/dev/null | head -1)
          echo "=== zo4/b.smali ($(wc -l < "$F") lines) ==="
          cat "$F"

      - name: 7. Search for signature-related code patterns
        run: |
          cd /tmp/mod
          echo "=== Signature string patterns ==="
          grep -rn 'signature\|certificate\|verify\|SecurityGuard\|SecurityEnv\|NSecurity' smali* 2>/dev/null | grep -v 'androidx\|android/support\|\.prologue\|\.line' | head -30
          echo ""
          echo "=== APK file path patterns ==="
          grep -rn '/data/app\|base.apk\|sourceDir\|publicSourceDir' smali* 2>/dev/null | grep -v 'androidx\|\.prologue\|\.line' | head -20
