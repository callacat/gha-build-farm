name: 红果短剧 去强制更新
run-name: HG Mod — ${{ inputs.workflow || 'analysis' }}

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: '分析(analysis) 或 打补丁(patch)'
        required: true
        default: 'analysis'
        type: choice
        options:
          - analysis
          - patch

env:
  APK_URL: "https://cloud.dsdog.tk/d/google/%E5%AE%89%E5%8D%93/%E5%BD%B1%E9%9F%B3%E8%A7%86%E5%90%AC/H%E6%9E%9C%E5%85%8D%E8%B4%B9%E7%9F%AD%E5%89%A7_7.2.7.32(72732)-%E4%BC%9A%E5%91%98%E7%BA%AF%E5%87%80%E4%BF%AE%E5%A4%8D%E7%89%88.apk?sign=XpRzLWaxNsoAsszxIlnpMRqoh5-3cJxap3ZDqlXcoaM=:0"

jobs:
  analyze:
    if: ${{ inputs.workflow == 'analysis' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jadx + apktool
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download APK
        run: |
          curl -sL --max-time 300 "$APK_URL" -o /tmp/hg.apk
          ls -lh /tmp/hg.apk
          file /tmp/hg.apk

      - name: jadx decompile (Java)
        run: |
          mkdir -p /tmp/jadx_out
          timeout 180 /opt/jadx/bin/jadx --show-bad-code -d /tmp/jadx_out /tmp/hg.apk 2>&1 | tail -5
          echo "=== Java files ==="
          find /tmp/jadx_out -name '*.java' | wc -l

      - name: apktool decode
        run: |
          /opt/apktool d /tmp/hg.apk -o /tmp/apktool_out -f --use-aapt2 2>&1 | tail -3
          echo "=== smali files ==="
          find /tmp/apktool_out -name '*.smali' | wc -l

      - name: 1. Package info
        run: |
          echo "=== Package ==="
          grep -m1 'package=' /tmp/apktool_out/AndroidManifest.xml || true
          echo "=== Main Activity ==="
          grep -A2 'MAIN' /tmp/apktool_out/AndroidManifest.xml | head -10 || true
          echo "=== Version ==="
          grep -oP 'version(?:Name|Code)="[^"]*"' /tmp/apktool_out/AndroidManifest.xml || true

      - name: 2. Find update-related activities/receivers
        run: |
          echo "=== UPDATE IN MANIFEST ==="
          grep -n -i 'update\|check.*version\|Upgrade\|ota' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null || echo "(none)"
          echo ""
          echo "=== UPDATE ACTIVITIES ==="
          grep -B1 -A5 'name=.*[Uu]pdate\|name=.*[Uu]pgrade\|name=.*[Vv]ersion\|name=.*[Cc]heck' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | head -40

      - name: 3. Search update smali patterns
        run: |
          echo "=== forceUpdate / mustUpdate / needUpdate ==="
          grep -rn 'forceUpdate\|force_update\|mustUpdate\|needUpdate\|shouldUpdate\|isUpdate\|checkUpdate\|doUpdate' /tmp/apktool_out/smali* --include='*.smali' 2>/dev/null | head -30
          echo ""
          echo "=== Dialog / Alert in update context ==="
          grep -rn 'AlertDialog\|Builder\|setCancelable\|setPositiveButton\|setNegativeButton' /tmp/apktool_out/smali* --include='*.smali' 2>/dev/null | grep -i -B3 'update\|version\|force' | head -30
          echo ""
          echo "=== Version check ==="
          grep -rn 'getVersionCode\|getVersionName\|VersionName\|VersionCode' /tmp/apktool_out/smali* --include='*.smali' 2>/dev/null | head -20

      - name: 4. Search update Java patterns
        run: |
          echo "=== Update-related Java classes ==="
          find /tmp/jadx_out -name '*Update*' -o -name '*Upgrade*' -o -name '*VersionCheck*' 2>/dev/null | head -20
          echo ""
          echo "=== force keyword in Java ==="
          grep -rn 'force' /tmp/jadx_out --include='*.java' 2>/dev/null | grep -i 'update\|version\|dialog\|upgrade' | head -20
          echo ""
          echo "=== Cancelable false / force dialog ==="
          grep -rn 'setCancelable.*false\|setCanceledOnTouchOutside.*false' /tmp/jadx_out --include='*.java' 2>/dev/null | head -15

      - name: 5. Find the app package name and main module
        run: |
          PKG=$(grep -m1 'package=' /tmp/apktool_out/AndroidManifest.xml | sed 's/.*package="//;s/".*//')
          echo "Package: $PKG"
          echo ""
          echo "=== App Application class ==="
          APP=$(grep -m1 'android:name="' /tmp/apktool_out/AndroidManifest.xml | head -5 | grep 'application' || true)
          grep -A1 '<application' /tmp/apktool_out/AndroidManifest.xml | head -5
          echo ""
          echo "=== MainActivity ==="
          grep -A2 'MAIN' /tmp/apktool_out/AndroidManifest.xml | grep -o 'android:name="[^"]*"' 2>/dev/null || true

      - name: 6. App store / market related (update source)
        run: |
          echo "=== App Store / Market URLs ==="
          grep -rn 'market://\|play.google\|appstore\|AppStore\|app\.xiaomi\|hihonor.*app\|vivo.*market\|oppo.*market' /tmp/jadx_out --include='*.java' 2>/dev/null | head -15
          echo ""
          echo "=== Download URLs ==="
          grep -rn 'http.*download\|http.*apk\|http.*update' /tmp/jadx_out --include='*.java' 2>/dev/null | head -15

      - name: 7. Find key activities list
        run: |
          echo "=== ALL EXPORTED ACTIVITIES ==="
          grep -B1 'exported="true"' /tmp/apktool_out/AndroidManifest.xml | grep -E 'activity|<activity' | head -30 || true
          echo ""
          echo "=== ALL RECEIVERS ==="
          grep -B1 'exported="true"' /tmp/apktool_out/AndroidManifest.xml | grep -E 'receiver|<receiver' | head -20 || true

      - name: Extract key update smali files
        run: |
          mkdir -p /tmp/key-files
          PKG=$(grep -m1 'package=' /tmp/apktool_out/AndroidManifest.xml | sed 's/.*package="//;s/".*//')
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "=== Main package smali output ==="
          find /tmp/apktool_out/smali*/$PKG_PATH -name '*Update*' -o -name '*Upgrade*' -o -name '*Version*' 2>/dev/null | head -20 > /tmp/key-files/update-files.txt
          cat /tmp/key-files/update-files.txt
          echo ""
          echo "=== Number of update-related files ==="
          wc -l /tmp/key-files/update-files.txt

      - name: 🔍 Search ALL files for modder server (changzhi.top)
        run: python3 .github/scripts/hg-search-all-files.py

      - name: 🔍 Find port 10008 modder server
        run: python3 .github/scripts/hg-find-port.py

      - name: Upload port search result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-search
          path: /tmp/port-search.txt
          compression-level: 0
          retention-days: 7

      - name: Upload all-files search result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-files-search
          path: /tmp/all-files-search.txt
          compression-level: 0
          retention-days: 7

      - name: 🔍 Ultimate search — modder URL in smali
        run: python3 .github/scripts/hg-find-trigger.py

      - name: 🔍 Analyze modder connection method for NOP
        run: python3 .github/scripts/hg-nop-modder.py

      - name: Upload modder method context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modder-method-context
          path: /tmp/mainfragment_context.txt
          compression-level: 0
          retention-days: 7

      - name: Upload analysis result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-analysis
          path: /tmp/trigger-analysis.txt
          compression-level: 2
          retention-days: 7

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: hg-analysis
          path: |
            /tmp/jadx_out/
            /tmp/apktool_out/AndroidManifest.xml
            /tmp/key-files/
          compression-level: 3
          retention-days: 7

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ 红果短剧去更新构建成功 (analysis)\n$RUN_URL"
          else
            MSG="❌ 红果短剧去更新构建失败 (analysis)\n$RUN_URL"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" || true

      - name: Clean old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          retain_days: 0
          keep_minimum_runs: 5

  patch:
    if: ${{ inputs.workflow == 'patch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jadx + apktool
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Install signing tools
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null
          # GHA ubuntu-22.04 has Android SDK pre-installed
          export A2=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 2>/dev/null | head -1)
          if [ -n "$A2" ]; then echo "AAPT2=$A2" >> $GITHUB_ENV; fi

      - name: Download APK
        run: |
          curl -sL --max-time 300 "$APK_URL" -o /tmp/hg.apk
          ls -lh /tmp/hg.apk

      - name: apktool decode (skip resources)
        run: |
          /opt/apktool d /tmp/hg.apk -o /tmp/apktool_out -f -r 2>&1 | tail -3

      - name: 🔍 Search for "立即更新" string references globally
        run: python3 .github/scripts/hg-find-update-string.py

      - name: Upload update string references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-string-refs
          path: /tmp/update-string-refs.txt
          compression-level: 0
          retention-days: 7

      - name: 方案B — 清空 oneseeker.top 字符串
        run: python3 .github/scripts/hg-plan-b.py /tmp/apktool_out

      - name: 方案A — 替换为 LDPlayer 域名
        run: python3 .github/scripts/hg-plan-a.py /tmp/apktool_out

      - name: Apply domain poison patches
        run: python3 .github/scripts/hg-smali-patch.py /tmp/apktool_out

      - name: Apply update dialog patches
        run: python3 .github/scripts/hg-update-patch.py /tmp/apktool_out /tmp/hg.apk
      - name: Find dialog source
        run: python3 .github/scripts/hg-find-dialog.py /tmp/apktool_out || true

      - name: Search all oneseeker references
        run: bash .github/scripts/hg-search-oneseeker.sh /tmp/apktool_out || true

      - name: Search resources.arsc and res/ XML
        run: bash .github/scripts/hg-search-resources.sh /tmp/apktool_out || true

      - name: Search Native .so libraries
        run: bash .github/scripts/hg-search-native.sh /tmp/apktool_out || true

      - name: Search obfuscated string patterns
        run: timeout 120 bash .github/scripts/hg-search-obfuscated.sh /tmp/apktool_out || true

      - name: Search update UI and network triggers
        run: timeout 120 bash .github/scripts/hg-search-update-ui.sh /tmp/apktool_out || true

      - name: Rebuild APK
        run: |
          /opt/apktool b /tmp/apktool_out -o /tmp/hg-unsigned.apk --copy-original 2>&1 | tail -10
          ls -lh /tmp/hg-unsigned.apk

      - name: Sign APK (v2/v3 zipalign + apksigner)
        run: |
          SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d | sort -Vr | head -1)

          # Strip old signatures — delete all .SF/.RSA/.MF at root META-INF
          zip -d /tmp/hg-unsigned.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' 2>/dev/null || true
          # zipalign
          $BT/zipalign -v -p 4 /tmp/hg-unsigned.apk /tmp/hg-aligned.apk 2>&1 | tail -2
          # apksigner v2/v3
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/hg-modified.apk /tmp/hg-aligned.apk 2>&1 | tail -5
          $BT/apksigner verify --verbose /tmp/hg-modified.apk 2>&1 | head -15
          ls -lh /tmp/hg-modified.apk

      - name: Upload patched APK to Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # Remove old release + tag if they exist
          gh release delete hg-latest --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin hg-latest 2>/dev/null || true

          # Create new release + attach APK
          gh release create hg-latest \
            --repo ${{ github.repository }} \
            --title "红果短剧 去更新 (latest)" \
            --notes "构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            /tmp/hg-modified.apk

          echo ""
          echo "✅ 下载链接（模拟器浏览器直接打开）:"
          echo "https://github.com/${{ github.repository }}/releases/download/hg-latest/hg-modified.apk"
          echo ""
          echo "✅ gh-proxy 加速（家宽）:"
          echo "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/hg-latest/hg-modified.apk"

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/hg-latest/hg-modified.apk"
          GH_PROXY="https://gh-proxy.com/${DOWNLOAD_URL}"
          if [ "$STATUS" = "success" ]; then
            MSG=$(printf '✅ 红果短剧 patch 构建成功\nRun: %s\n直链: %s\n加速: %s' \
              "$RUN_URL" "$DOWNLOAD_URL" "$GH_PROXY")
          else
            MSG=$(printf '❌ 红果短剧 patch 构建失败\nRun: %s' "$RUN_URL")
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" || true

      - name: Clean old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          retain_days: 0
          keep_minimum_runs: 5
