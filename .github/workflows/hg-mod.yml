name: Mod Patch Pipeline
run-name: ${{ inputs.app_id || 'app' }} ${{ inputs.workflow || 'analysis' }}

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: '应用ID (用于 release tag 前缀, 如 hg/fq/xhs)'
        required: true
        default: 'hg'
      apk_url:
        description: 'APK 下载地址（可留空，优先使用 URL，再 Fallback Release 缓存）'
        required: false
        default: ''
      workflow:
        description: '选择工作流：analysis=分析，patch=去弹窗版，remove-ads=去广告版'
        required: true
        default: 'analysis'
        type: choice
        options:
          - analysis
          - patch
          - remove-ads

  push:
    branches: [main]
    paths:
      - '.github/workflows/hg-mod.yml'
      - '.github/scripts/hg-*'

env:
  APK_URL: ${{ inputs.apk_url }}

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts syntax
        run: |
          for f in .github/scripts/hg-*.py; do
            python3 -c "compile(open('$f').read(), '$f', 'exec')" && echo "  ✅ $f" || echo "  ❌ $f"
          done
          for f in .github/scripts/hg-*.sh; do
            bash -n "$f" && echo "  ✅ $f" || echo "  ❌ $f"
          done

  analyze:
    if: ${{ inputs.workflow == 'analysis' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jadx + apktool
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: 📦 Fetch APK (release cache preferred)
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ID="${{ inputs.app_id }}"

          # Step 1: try downloading from URL if provided
          if [ -n "$APK_URL" ]; then
            echo "Downloading from URL..."
            curl -sL --max-time 300 "$APK_URL" -o /tmp/$ID.apk
            SIZE=$(stat -c%s /tmp/$ID.apk 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1024 ]; then
              SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
              BADGING=$(find "$SDK" -name aapt2 2>/dev/null | head -1)
              if [ -n "$BADGING" ]; then
                VERSION=$($BADGING dump badging /tmp/$ID.apk 2>/dev/null | grep -oP "versionName='[^']+'" | sed "s/versionName='//;s/'//")
              fi
              VERSION="${VERSION:-unknown}"
              echo "CACHED_VERSION=$VERSION" >> $GITHUB_ENV
              CACHE_TAG="$ID-original-$VERSION"
              echo "CACHE_TAG=$CACHE_TAG" >> $GITHUB_ENV
              if ! gh release view "$CACHE_TAG" --repo ${{ github.repository }} &>/dev/null; then
                echo "Caching original APK..."
                gh release create "$CACHE_TAG" --repo ${{ github.repository }} --title "$ID $VERSION original" --notes "$ID $VERSION 原始APK" "/tmp/$ID.apk" 2>/dev/null || true
              fi
              echo "✅ Downloaded $ID v$VERSION ($SIZE bytes)"
              ls -lh /tmp/$ID.apk
              exit 0
            fi
          fi

          # Step 2: fallback to release cache
          echo "Trying release cache..."
          CACHE_TAG=$(gh release list --repo ${{ github.repository }} -L 30 --json tagName \
            | python3 -c "import sys,json;rels=json.load(sys.stdin);tags=[r['tagName'] for r in rels if r['tagName'].startswith('$ID-original-')];print(max(tags) if tags else '')" 2>/dev/null)
          if [ -n "$CACHE_TAG" ]; then
            echo "📦 Using release cache: $CACHE_TAG"
            gh release download "$CACHE_TAG" --repo ${{ github.repository }} --pattern "*.apk" --dir /tmp --clobber 2>/dev/null
            mv /tmp/*.apk /tmp/$ID.apk 2>/dev/null || true
            VERSION=$(echo "$CACHE_TAG" | sed 's/^$ID-original-//')
            echo "CACHED_VERSION=$VERSION" >> $GITHUB_ENV
            echo "CACHE_TAG=$CACHE_TAG" >> $GITHUB_ENV
            echo "✅ Using $ID v$VERSION from release cache"
            ls -lh /tmp/$ID.apk
            file /tmp/$ID.apk
            exit 0
          fi

          echo "❌ No cache or URL download failed. Provide APK_URL."
          exit 1

      - name: jadx decompile (Java)
        run: |
          mkdir -p /tmp/jadx_out
          timeout 180 /opt/jadx/bin/jadx --show-bad-code -d /tmp/jadx_out /tmp/${{ inputs.app_id }}.apk 2>&1 | tail -5
          echo "=== Java files ==="
          find /tmp/jadx_out -name '*.java' | wc -l

      - name: apktool decode
        run: |
          /opt/apktool d /tmp/${{ inputs.app_id }}.apk -o /tmp/apktool_out -f 2>&1 | tail -3
          echo "=== smali files ==="
          find /tmp/apktool_out -name '*.smali' | wc -l

      - name: 1. Package info
        run: |
          echo "=== Package ==="
          grep -m1 'package=' /tmp/apktool_out/AndroidManifest.xml || true
          echo "=== Main Activity ==="
          grep -A2 'MAIN' /tmp/apktool_out/AndroidManifest.xml | head -10 || true
          echo "=== Version ==="
          grep -oP 'version(?:Name|Code)="[^"]*"' /tmp/apktool_out/AndroidManifest.xml || true

      - name: 2. Find update-related activities/receivers
        run: |
          echo "=== UPDATE IN MANIFEST ==="
          grep -n -i 'update\|check.*version\|Upgrade\|ota' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null || echo "(none)"
          echo ""
          echo "=== UPDATE ACTIVITIES ==="
          grep -B1 -A5 'name=.*[Uu]pdate\|name=.*[Uu]pgrade\|name=.*[Vv]ersion\|name=.*[Cc]heck' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | head -40

      - name: 3. Search update smali patterns
        run: |
          echo "=== forceUpdate / mustUpdate / needUpdate ==="
          grep -rn 'forceUpdate\|force_update\|mustUpdate\|needUpdate\|shouldUpdate\|isUpdate\|checkUpdate\|doUpdate' /tmp/apktool_out/smali* --include='*.smali' 2>/dev/null | head -30
          echo ""
          echo "=== Dialog / Alert in update context ==="
          grep -rn 'AlertDialog\|Builder\|setCancelable\|setPositiveButton\|setNegativeButton' /tmp/apktool_out/smali* --include='*.smali' 2>/dev/null | grep -i -B3 'update\|version\|force' | head -30
          echo ""
          echo "=== Version check ==="
          grep -rn 'getVersionCode\|getVersionName\|VersionName\|VersionCode' /tmp/apktool_out/smali* --include='*.smali' 2>/dev/null | head -20

      - name: 4. Search update Java patterns
        run: |
          echo "=== Update-related Java classes ==="
          find /tmp/jadx_out -name '*Update*' -o -name '*Upgrade*' -o -name '*VersionCheck*' 2>/dev/null | head -20
          echo ""
          echo "=== force keyword in Java ==="
          grep -rn 'force' /tmp/jadx_out --include='*.java' 2>/dev/null | grep -i 'update\|version\|dialog\|upgrade' | head -20
          echo ""
          echo "=== Cancelable false / force dialog ==="
          grep -rn 'setCancelable.*false\|setCanceledOnTouchOutside.*false' /tmp/jadx_out --include='*.java' 2>/dev/null | head -15

      - name: 5. Find the app package name and main module
        run: |
          PKG=$(grep -m1 'package=' /tmp/apktool_out/AndroidManifest.xml | sed 's/.*package="//;s/".*//')
          echo "Package: $PKG"
          echo ""
          echo "=== App Application class ==="
          APP=$(grep -m1 'android:name="' /tmp/apktool_out/AndroidManifest.xml | head -5 | grep 'application' || true)
          grep -A1 '<application' /tmp/apktool_out/AndroidManifest.xml | head -5
          echo ""
          echo "=== MainActivity ==="
          grep -A2 'MAIN' /tmp/apktool_out/AndroidManifest.xml | grep -o 'android:name="[^"]*"' 2>/dev/null || true

      - name: 6. App store / market related (update source)
        run: |
          echo "=== App Store / Market URLs ==="
          grep -rn 'market://\|play.google\|appstore\|AppStore\|app\.xiaomi\|hihonor.*app\|vivo.*market\|oppo.*market' /tmp/jadx_out --include='*.java' 2>/dev/null | head -15
          echo ""
          echo "=== Download URLs ==="
          grep -rn 'http.*download\|http.*apk\|http.*update' /tmp/jadx_out --include='*.java' 2>/dev/null | head -15

      - name: 7. Find key activities list
        run: |
          echo "=== ALL EXPORTED ACTIVITIES ==="
          grep -B1 'exported="true"' /tmp/apktool_out/AndroidManifest.xml | grep -E 'activity|<activity' | head -30 || true
          echo ""
          echo "=== ALL RECEIVERS ==="
          grep -B1 'exported="true"' /tmp/apktool_out/AndroidManifest.xml | grep -E 'receiver|<receiver' | head -20 || true

      - name: Extract key update smali files
        run: |
          mkdir -p /tmp/key-files
          PKG=$(grep -m1 'package=' /tmp/apktool_out/AndroidManifest.xml | sed 's/.*package="//;s/".*//')
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "=== Main package smali output ==="
          find /tmp/apktool_out/smali*/$PKG_PATH -name '*Update*' -o -name '*Upgrade*' -o -name '*Version*' 2>/dev/null | head -20 > /tmp/key-files/update-files.txt
          cat /tmp/key-files/update-files.txt
          echo ""
          echo "=== Number of update-related files ==="
          wc -l /tmp/key-files/update-files.txt

      - name: 🔍 Search ALL files for modder server (changzhi.top)
        run: python3 .github/scripts/hg-search-all-files.py

      - name: Upload all-files search result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-files-search
          path: /tmp/all-files-search.txt
          compression-level: 0
          retention-days: 7

      - name: 🔍 Ultimate search — modder URL in smali
        run: python3 .github/scripts/hg-find-trigger.py

      - name: 🔍 Search for third-party group dialog (鹿属/软件使用声明)
        run: python3 .github/scripts/hg-find-group-dialog.py

      - name: 🔍 Analyze modder connection method for NOP
        run: python3 .github/scripts/hg-nop-modder.py

      - name: Upload modder method context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modder-method-context
          path: /tmp/mainfragment_context.txt
          compression-level: 0
          retention-days: 7

      - name: Upload analysis result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-analysis
          path: /tmp/trigger-analysis.txt
          compression-level: 2
          retention-days: 7

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: hg-analysis
          path: |
            /tmp/jadx_out/
            /tmp/apktool_out/AndroidManifest.xml
            /tmp/key-files/
          compression-level: 3
          retention-days: 7

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ID="${{ inputs.app_id }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ $ID 分析完成\n$RUN_URL"
          else
            MSG="❌ $ID 分析失败\n$RUN_URL"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" || true

      - name: Clean old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          retain_days: 0
          keep_minimum_runs: 5

  patch:
    if: ${{ inputs.workflow == 'patch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jadx + apktool
        run: |
          curl -sL "https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx && chmod +x /opt/jadx/bin/jadx
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Install signing tools
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null
          # GHA ubuntu-22.04 has Android SDK pre-installed
          export A2=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 2>/dev/null | head -1)
          if [ -n "$A2" ]; then echo "AAPT2=$A2" >> $GITHUB_ENV; fi

      - name: 📦 Fetch APK (download or release cache)
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ID="${{ inputs.app_id }}"

          # Step 1: try downloading from URL
          if [ -n "$APK_URL" ]; then
            echo "Downloading from URL..."
            curl -sL --max-time 300 "$APK_URL" -o /tmp/$ID.apk
            SIZE=$(stat -c%s /tmp/$ID.apk 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1024 ]; then
              # Extract version from binary AndroidManifest using aapt/apktool
              SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
              BADGING=$(find "$SDK" -name aapt2 2>/dev/null | head -1)
              if [ -n "$BADGING" ]; then
                VERSION=$($BADGING dump badging /tmp/$ID.apk 2>/dev/null | grep -oP "versionName='[^']+'" | sed "s/versionName='//;s/'//")
              fi
              VERSION="${VERSION:-unknown}"
              echo "APK version: $VERSION"
              echo "CACHED_VERSION=$VERSION" >> $GITHUB_ENV
              CACHE_TAG="$ID-original-$VERSION"
              echo "CACHE_TAG=$CACHE_TAG" >> $GITHUB_ENV
              if ! gh release view "$CACHE_TAG" --repo ${{ github.repository }} &>/dev/null; then
                echo "Caching original APK..."
                gh release create "$CACHE_TAG" --repo ${{ github.repository }} --title "$ID $VERSION original" --notes "$ID $VERSION 原始APK" "/tmp/$ID.apk" 2>/dev/null || true
              fi
              ls -lh /tmp/$ID.apk
              exit 0
            fi
          fi

          # Step 2: fallback to release cache
          echo "Trying release cache..."
          CACHE_TAG=$(gh release list --repo ${{ github.repository }} --json tagName \
            | python3 -c "import sys,json;rels=json.load(sys.stdin);tags=[r['tagName'] for r in rels if r['tagName'].startswith('$ID-original-')];print(max(tags) if tags else '')" 2>/dev/null)
          if [ -n "$CACHE_TAG" ]; then
            gh release download "$CACHE_TAG" --repo ${{ github.repository }} --pattern "*.apk" --dir /tmp --clobber 2>/dev/null
            mv /tmp/*.apk /tmp/$ID.apk 2>/dev/null || true
            VERSION=$(echo "$CACHE_TAG" | sed 's/^$ID-original-//')
            echo "CACHED_VERSION=$VERSION" >> $GITHUB_ENV
            echo "CACHE_TAG=$CACHE_TAG" >> $GITHUB_ENV
            ls -lh /tmp/$ID.apk
          else
            echo "No cache found. Provide a valid APK_URL."
            exit 1
          fi

      - name: apktool decode (full, no -r — need all smali classes for NOP)
        run: |
          /opt/apktool d /tmp/${{ inputs.app_id }}.apk -o /tmp/apktool_out -f 2>&1 | tail -5
          echo "=== smali dirs ==="
          ls -d /tmp/apktool_out/smali* 2>/dev/null | wc -l

      - name: 🔍 Search for "立即更新" string references globally
        run: python3 .github/scripts/hg-find-update-string.py

      - name: Upload update string references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-string-refs
          path: /tmp/update-string-refs.txt
          compression-level: 0
          retention-days: 7

      - name: 方案B — 清空 oneseeker.top 字符串
        run: python3 .github/scripts/hg-plan-b.py /tmp/apktool_out

      - name: 方案A — 替换为 LDPlayer 域名
        run: python3 .github/scripts/hg-plan-a.py /tmp/apktool_out

      - name: Apply domain poison patches
        run: python3 .github/scripts/hg-smali-patch.py /tmp/apktool_out

      - name: Apply update dialog patches
        run: python3 .github/scripts/hg-update-patch.py /tmp/apktool_out /tmp/${{ inputs.app_id }}.apk

      - name: 🧊 NOP 鹿属 dialog native entry point (C4409.m23296)
        run: python3 .github/scripts/hg-nop-dialog-native.py /tmp/apktool_out

      - name: Find dialog source
        run: python3 .github/scripts/hg-find-dialog.py /tmp/apktool_out || true

      - name: Search all oneseeker references
        run: bash .github/scripts/hg-search-oneseeker.sh /tmp/apktool_out || true

      - name: Search previous CJPay references (for reference)
        run: bash .github/scripts/hg-search-resources.sh /tmp/apktool_out || true

      # CJPaySDK 步骤跳过 — 对鹿属修改版: libseccore.so JNI 引用导致 SIGSEGV
      # 对官方版需用 hg-remove-cjpaysdk.py

      - name: 🗑️ NOP 鹿属弹窗 (DialogFragmentC4433 + sgcore0)
        run: python3 .github/scripts/hg-nop-modder-dialog.py /tmp/apktool_out

      - name: Search Native .so libraries
        run: bash .github/scripts/hg-search-native.sh /tmp/apktool_out || true

      - name: Search obfuscated string patterns
        run: timeout 120 bash .github/scripts/hg-search-obfuscated.sh /tmp/apktool_out || true

      - name: Search update UI and network triggers
        run: timeout 120 bash .github/scripts/hg-search-update-ui.sh /tmp/apktool_out || true

      - name: Rebuild APK
        run: |
          python3 .github/scripts/fix-public-xml.py
          /opt/apktool b /tmp/apktool_out -o /tmp/${{ inputs.app_id }}-unsigned.apk 2>&1
          ls -lh /tmp/${{ inputs.app_id }}-unsigned.apk

      - name: Sign APK (v2/v3 zipalign Zopfli + apksigner)
        run: |
          SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d | sort -Vr | head -1)

          $BT/zipalign -z 4 /tmp/${{ inputs.app_id }}-unsigned.apk /tmp/${{ inputs.app_id }}-aligned.apk 2>&1 | tail -2
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/${{ inputs.app_id }}-signed.apk /tmp/${{ inputs.app_id }}-aligned.apk 2>&1 | tail -5
          $BT/apksigner verify --verbose /tmp/${{ inputs.app_id }}-signed.apk 2>&1 | head -15

          # Extract version and rename APK to include version number
          VERSION="${CACHED_VERSION:-$(grep -oP 'versionName="[^"]*"' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | sed 's/versionName="//;s/"//')}"
          APK_NAME="${{ inputs.app_id }}-patch-${VERSION}-b${{ github.run_number }}.apk"
          cp /tmp/${{ inputs.app_id }}-signed.apk "/tmp/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_VERSION=${VERSION:-unknown}" >> $GITHUB_ENV
          ls -lh "/tmp/$APK_NAME"

      - name: Upload patched APK to Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ID="${{ inputs.app_id }}"
          VERSION="${APK_VERSION:-unknown}"
          APK_NAME="$ID-patch-${VERSION}-b${{ github.run_number }}.apk"
          echo "Releasing: $APK_NAME (version $VERSION)"

          TAG_VERSION="v${VERSION}"
          echo "Tag: $TAG_VERSION"

          # ── Write release notes to temp file ──
          rm -f /tmp/release-notes.md
          echo "**📦 红果短剧 去弹窗版**" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**版本:** $VERSION" >> /tmp/release-notes.md
          echo "**修改内容:**" >> /tmp/release-notes.md
          echo "- 去除更新弹窗（强制更新/版本检查）" >> /tmp/release-notes.md
          echo "- 去除鹿属远程弹窗（域名屏蔽 oneseeker/remote.oneseeker）" >> /tmp/release-notes.md
          echo "**构建时间:** $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> /tmp/release-notes.md
          echo "**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**下载：**" >> /tmp/release-notes.md
          echo "- Latest: https://github.com/${{ github.repository }}/releases/download/$ID-patch-latest/$APK_NAME" >> /tmp/release-notes.md
          echo "- Versioned: https://github.com/${{ github.repository }}/releases/download/$ID-patch-$TAG_VERSION/$APK_NAME" >> /tmp/release-notes.md
          echo "- 加速: https://gh-proxy.dsurl.eu.org/https://github.com/${{ github.repository }}/releases/download/$ID-patch-latest/$APK_NAME" >> /tmp/release-notes.md

          # ── 1. Latest release (always newest) ──
          gh release delete "$ID-patch-latest" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "$ID-patch-latest" 2>/dev/null || true
          gh release create "$ID-patch-latest" \
            --repo ${{ github.repository }} \
            --title "红果短剧 去弹窗版 (latest)" \
            --notes-file /tmp/release-notes.md \
            "/tmp/$APK_NAME"

          # ── 2. Versioned release ──
          gh release delete "$ID-patch-$TAG_VERSION" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "$ID-patch-$TAG_VERSION" 2>/dev/null || true
          gh release create "$ID-patch-$TAG_VERSION" \
            --repo ${{ github.repository }} \
            --title "红果短剧 去弹窗版 $TAG_VERSION" \
            --notes-file /tmp/release-notes.md \
            "/tmp/$APK_NAME"

          echo ""
          echo "✅ 下载链接:"
          echo "  Latest: https://github.com/${{ github.repository }}/releases/download/$ID-patch-latest/$APK_NAME"
          echo "  Versioned: https://github.com/${{ github.repository }}/releases/download/$ID-patch-$TAG_VERSION/$APK_NAME"
          echo ""
          echo "✅ gh-proxy:"
          echo "  https://gh-proxy.dsurl.eu.org/https://github.com/${{ github.repository }}/releases/download/$ID-patch-latest/$APK_NAME"

      - name: Clean old versioned releases (keep last 5)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          python3 -c "
          import subprocess, json, sys
          ID = '${{ inputs.app_id }}'
          res = subprocess.run(['gh', 'release', 'list', '--repo', '${{ github.repository }}', '--json', 'tagName,isLatest,createdAt'], capture_output=True, text=True)
          releases = json.loads(res.stdout)
          prefix = ID + '-patch-v'
          vers = [r for r in releases if r['tagName'].startswith(prefix) and not r['isLatest']]
          vers.sort(key=lambda r: r['createdAt'], reverse=True)
          for r in vers[5:]:
              tag = r['tagName']
              print(f'Deleting old release: {tag}')
              subprocess.run(['gh', 'release', 'delete', tag, '--yes', '--repo', '${{ github.repository }}'], capture_output=True)
              subprocess.run(['git', 'push', '--delete', 'origin', tag], capture_output=True)
          kept = min(len(vers), 5)
          print(f'Kept {kept}, deleted {len(vers)-kept}')
          "

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ID="${{ inputs.app_id }}"
          APK_NAME="${APK_NAME:-$ID-patch-unknown.apk}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$ID-patch-latest/$APK_NAME"
          GH_PROXY="https://gh-proxy.dsurl.eu.org/${DOWNLOAD_URL}"
          if [ "$STATUS" = "success" ]; then
            MSG=$(printf '✅ %s patch 构建成功\nRun: %s\n直链: %s\n加速: %s' \
              "$ID" "$RUN_URL" "$DOWNLOAD_URL" "$GH_PROXY")
          else
            MSG=$(printf '❌ %s patch 构建失败\nRun: %s' "$ID" "$RUN_URL")
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" || true

      - name: Clean old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          retain_days: 0
          keep_minimum_runs: 5

  remove_ads:
    if: ${{ inputs.workflow == 'remove-ads' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Install signing tools
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null
          SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
          BADGING=$(find "$SDK" -name aapt2 2>/dev/null | head -1)
          if [ -n "$BADGING" ]; then echo "AAPT2=$BADGING" >> $GITHUB_ENV; fi

      - name: 📦 Fetch APK (URL优先，缓存兜底)
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ID="${{ inputs.app_id }}"

          # Step 1: URL specified — download fresh (ensures correct version)
          if [ -n "$APK_URL" ]; then
            echo "Downloading from URL..."
            curl -sL --max-time 300 "$APK_URL" -o /tmp/$ID.apk
            SIZE=$(stat -c%s /tmp/$ID.apk 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1024 ]; then
              SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
              BADGING=$(find "$SDK" -name aapt2 2>/dev/null | head -1)
              if [ -n "$BADGING" ]; then
                VERSION=$($BADGING dump badging /tmp/$ID.apk 2>/dev/null | grep -oP "versionName='[^']+'" | sed "s/versionName='//;s/'//")
              fi
              VERSION="${VERSION:-unknown}"
              echo "APK version: $VERSION"
              echo "CACHED_VERSION=$VERSION" >> $GITHUB_ENV
              if ! gh release view "$ID-original-$VERSION" --repo ${{ github.repository }} &>/dev/null; then
                echo "Caching original APK..."
                gh release create "$ID-original-$VERSION" --repo ${{ github.repository }} --title "$ID $VERSION original" --notes "$ID $VERSION 原始APK" "/tmp/$ID.apk" 2>/dev/null || true
              fi
              echo "✅ Downloaded $ID v$VERSION ($SIZE bytes)"
              ls -lh /tmp/$ID.apk
              exit 0
            fi
          fi

          # Step 2: fallback — use release cache
          CACHE_TAG=$(gh release list --repo ${{ github.repository }} -L 30 --json tagName \
            | python3 -c "import sys,json;rels=json.load(sys.stdin);tags=[r['tagName'] for r in rels if r['tagName'].startswith('$ID-original-')];print(max(tags) if tags else '')" 2>/dev/null)
          if [ -n "$CACHE_TAG" ]; then
            echo "📦 Using release cache: $CACHE_TAG"
            gh release download "$CACHE_TAG" --repo ${{ github.repository }} --pattern "*.apk" --dir /tmp --clobber 2>/dev/null
            mv /tmp/*.apk /tmp/$ID.apk 2>/dev/null || true
            VERSION=$(echo "$CACHE_TAG" | sed 's/^$ID-original-//')
            echo "CACHED_VERSION=$VERSION" >> $GITHUB_ENV
            echo "✅ Using $ID v$VERSION from release cache"
            ls -lh /tmp/$ID.apk
            file /tmp/$ID.apk
            exit 0
          fi

          echo "❌ No URL and no cache. Provide APK_URL or cache original first."
          exit 1

      - name: apktool decode
        run: |
          /opt/apktool d /tmp/${{ inputs.app_id }}.apk -o /tmp/apktool_out -f 2>&1 | tail -5
          echo "=== smali files ==="
          find /tmp/apktool_out -name '*.smali' | wc -l


      - name: 🔧 Fix network security config
        run: |
          python3 .github/scripts/hg-remove-ads.py \
            --source /tmp/apktool_out \
            --ad-config .github/config/ad-removal.json

      - name: 🧹 Smali-stub ad SDK packages (method body replacement)
        run: |
          python3 .github/scripts/hg-smali-stub.py \
            --source /tmp/apktool_out \
            --ad-config .github/config/ad-removal.json


      - name: Rebuild APK
        run: |
          python3 .github/scripts/fix-public-xml.py
          /opt/apktool b /tmp/apktool_out -o /tmp/${{ inputs.app_id }}-unsigned.apk 2>&1
          ls -lh /tmp/${{ inputs.app_id }}-unsigned.apk

      - name: Sign APK (v2/v3 zipalign + apksigner)
        run: |
          SDK=/usr/local/lib/android/sdk; [ -d "$SDK" ] || SDK=$ANDROID_HOME
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d | sort -Vr | head -1)

          zip -d /tmp/${{ inputs.app_id }}-unsigned.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' 2>/dev/null || true
          $BT/zipalign -v -p 4 /tmp/${{ inputs.app_id }}-unsigned.apk /tmp/${{ inputs.app_id }}-aligned.apk 2>&1 | tail -2
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/${{ inputs.app_id }}-signed.apk /tmp/${{ inputs.app_id }}-aligned.apk 2>&1 | tail -5
          $BT/apksigner verify --verbose /tmp/${{ inputs.app_id }}-signed.apk 2>&1 | head -15

          VERSION="${CACHED_VERSION:-$(grep -oP 'versionName="[^"]*"' /tmp/apktool_out/AndroidManifest.xml 2>/dev/null | sed 's/versionName="//;s/"//')}"
          APK_NAME="hg-remove-ads-${VERSION}-b${{ github.run_number }}.apk"
          cp /tmp/${{ inputs.app_id }}-signed.apk "/tmp/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_VERSION=${VERSION:-unknown}" >> $GITHUB_ENV
          ls -lh "/tmp/$APK_NAME"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          ID="${{ inputs.app_id }}"
          VERSION="${APK_VERSION:-unknown}"
          BUILD_NUM=${{ github.run_number }}
          APK_NAME="hg-remove-ads-${VERSION}-b${BUILD_NUM}.apk"
          TAG_VERSION="v${VERSION}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Rename APK to new naming convention
          cp "/tmp/${ID}-signed.apk" "/tmp/${APK_NAME}"

          rm -f /tmp/release-notes.md
          echo "**📦 红果短剧 去广告版**" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**版本:** $VERSION" >> /tmp/release-notes.md
          echo "**构建编号:** ${BUILD_NUM}" >> /tmp/release-notes.md
          echo "**构建时间:** $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**修改内容:**" >> /tmp/release-notes.md
          echo "- 删除广告 SDK（穿山甲/LuckyCat/百度/快手/灵谋）" >> /tmp/release-notes.md
          echo "- 删除推送 SDK（小米/华为/vivo/oppo/荣耀）" >> /tmp/release-notes.md
          echo "- 精简权限（仅保留网络/存储/前台服务）" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**下载：**" >> /tmp/release-notes.md
          echo "- 直链: https://github.com/${{ github.repository }}/releases/download/hg-remove-ads-latest/${APK_NAME}" >> /tmp/release-notes.md
          echo "- 加速: https://gh-proxy.dsurl.eu.org/https://github.com/${{ github.repository }}/releases/download/hg-remove-ads-latest/${APK_NAME}" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**GitHub Actions 构建:** [运行 #${BUILD_NUM}](${RUN_URL})" >> /tmp/release-notes.md

          # Latest release
          gh release delete "hg-remove-ads-latest" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "hg-remove-ads-latest" 2>/dev/null || true
          gh release create "hg-remove-ads-latest" \
            --repo ${{ github.repository }} \
            --title "红果短剧 去广告版 (latest)" \
            --notes-file /tmp/release-notes.md \
            "/tmp/${APK_NAME}"

          # Versioned release
          gh release delete "hg-remove-ads-${TAG_VERSION}" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "hg-remove-ads-${TAG_VERSION}" 2>/dev/null || true
          gh release create "hg-remove-ads-${TAG_VERSION}" \
            --repo ${{ github.repository }} \
            --title "红果短剧 去广告版 ${TAG_VERSION}" \
            --notes-file /tmp/release-notes.md \
            "/tmp/${APK_NAME}"

          echo "✅ 下载链接:"
          echo "  Latest: https://github.com/${{ github.repository }}/releases/download/hg-remove-ads-latest/${APK_NAME}"
          echo "  加速: https://gh-proxy.dsurl.eu.org/https://github.com/${{ github.repository }}/releases/download/hg-remove-ads-latest/${APK_NAME}"

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ID="${{ inputs.app_id }}"
          APK_NAME="${APK_NAME:-hg-remove-ads-unknown.apk}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/hg-remove-ads-latest/$APK_NAME"
          GH_PROXY="https://gh-proxy.dsurl.eu.org/${DOWNLOAD_URL}"
          if [ "$STATUS" = "success" ]; then
            MSG=$(printf '✅ %s 去广告构建成功\nRun: %s\n直链: %s\n加速: %s' \
              "$ID" "$RUN_URL" "$DOWNLOAD_URL" "$GH_PROXY")
          else
            MSG=$(printf '❌ %s 去广告构建失败\nRun: %s' "$ID" "$RUN_URL")
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=HTML" || true

      - name: Clean old versioned releases (keep last 5)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          python3 -c "
          import subprocess, json, sys
          res = subprocess.run(['gh', 'release', 'list', '--repo', '${{ github.repository }}', '--json', 'tagName,isLatest,createdAt'], capture_output=True, text=True)
          releases = json.loads(res.stdout)
          prefix = 'hg-remove-ads-v'
          vers = [r for r in releases if r['tagName'].startswith(prefix) and not r['isLatest']]
          vers.sort(key=lambda r: r['createdAt'], reverse=True)
          for r in vers[5:]:
              tag = r['tagName']
              print(f'Deleting old release: {tag}')
              subprocess.run(['gh', 'release', 'delete', tag, '--yes', '--repo', '${{ github.repository }}'], capture_output=True)
              subprocess.run(['git', 'push', '--delete', 'origin', tag], capture_output=True)
          kept = min(len(vers), 5)
          print(f'Kept {kept}, deleted {len(vers)-kept}')
          "

      - name: Clean old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          retain_days: 0
          keep_minimum_runs: 5
