name: Native lib so diff
on:
  workflow_dispatch: {}
env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
jobs:
  diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download
        run: |
          curl -sL "$OFFICIAL_URL" -o /tmp/o.apk -w "OFF: HTTP %{http_code}, size: %{size_download}\n"
          curl -sL "$MODDED_URL" -o /tmp/m.apk -w "MOD: HTTP %{http_code}, size: %{size_download}\n"

      - name: List libs
        run: |
          echo "=== OFFICIAL ==="; unzip -l /tmp/o.apk 'lib/arm64-v8a/*.so' | awk '/\.so/{print $4,$1}'
          echo "=== MODDED ==="; unzip -l /tmp/m.apk 'lib/arm64-v8a/*.so' | awk '/\.so/{print $4,$1}'

      - name: Size diff
        run: |
          unzip -l /tmp/o.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}' | sort > /tmp/o.txt
          unzip -l /tmp/m.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}' | sort > /tmp/m.txt
          echo "CHANGED:"; join /tmp/o.txt /tmp/m.txt | awk '{d=$2-$3;d=d<0?-d:d}d>100{print "  "$1" off="$2" mod="$3" delta="($2-$3)}'
          echo "MOD-ONLY:"; join -v2 /tmp/o.txt /tmp/m.txt | awk '{print "  "$1}'
          echo "OFF-ONLY:"; join -v1 /tmp/o.txt /tmp/m.txt | awk '{print "  "$1}'

      - name: Hex diff
        run: |
          mkdir -p /tmp/ol /tmp/ml
          unzip -q /tmp/o.apk 'lib/arm64-v8a/*.so' -d /tmp/ol
          unzip -q /tmp/m.apk 'lib/arm64-v8a/*.so' -d /tmp/ml
          cd /tmp/ol/lib/arm64-v8a
          for so in *.so; do
            mf="/tmp/ml/lib/arm64-v8a/$so"
            [ ! -f "$mf" ] && continue
            s1=$(stat -c%s "$so"); s2=$(stat -c%s "$mf")
            d=$((s1-s2)); d=${d#-}; [ "$d" -le 100 ] && continue
            python3 /dev/stdin "$so" "$mf" "$s1" "$s2" << 'EOF'
import sys
f1,s1,f2,s2 = "/tmp/ol/lib/arm64-v8a/"+sys.argv[1], sys.argv[3], sys.argv[2], sys.argv[4]
d1=open(f1,'rb').read(); d2=open(f2,'rb').read()
n=0
for i in range(0,min(len(d1),len(d2)),16):
    if d1[i:i+16]!=d2[i:i+16]:
        if n<8:
            print('@0x%05x'%i)
            a=' '.join('%02x'%b for b in d1[i:i+16])
            b=' '.join('%02x'%b for b in d2[i:i+16])
            sa=''.join(chr(b) if 32<=b<=126 else '.' for b in d1[i:i+16])
            sb=''.join(chr(b) if 32<=b<=126 else '.' for b in d2[i:i+16])
            print('  O: '+a+'  '+sa)
            print('  M: '+b+'  '+sb)
        n+=1
print('%s: %d regions (off=%s mod=%s)'%(sys.argv[1],n,s1.replace(' ',''),s2.replace(' ','')))
EOF
          done

      - name: DEX hash
        run: |
          python3 /dev/stdin << 'EOF'
import zipfile,hashlib
o=zipfile.ZipFile('/tmp/o.apk'); m=zipfile.ZipFile('/tmp/m.apk')
for f in sorted(set(o.namelist())|set(m.namelist())):
    if not f.endswith('.dex'): continue
    od=o.read(f) if f in o.namelist() else None
    md=m.read(f) if f in m.namelist() else None
    if od and md:
        if hashlib.sha256(od).hexdigest()!=hashlib.sha256(md).hexdigest():
            print('DIFF: %s off=%d mod=%d'%(f,len(od),len(md)))
    elif od: print('OFF-ONLY: %s (%d)'%(f,len(od)))
    elif md: print('MOD-ONLY: %s (%d)'%(f,len(md)))
EOF

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
