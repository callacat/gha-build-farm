name: SO Diff official vs modded
on:
  workflow_dispatch: {}
env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
jobs:
  diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          apt-get update -qq && apt-get install -y -qq xxd bsdiff 2>&1 | tail -3
          pip3 install pyelftools --break-system-packages -q 2>/dev/null || true

      - name: Download both APKs
        run: |
          curl -sL "$OFFICIAL_URL" -o /tmp/official.apk -w "OFF: HTTP %{http_code}, size: %{size_download}\n"
          curl -sL "$MODDED_URL" -o /tmp/modded.apk -w "MOD: HTTP %{http_code}, size: %{size_download}\n"

      - name: Extract lib directories
        run: |
          mkdir -p /tmp/off_lib /tmp/mod_lib
          unzip -q -o /tmp/official.apk 'lib/arm64-v8a/*' -d /tmp/off_lib 2>/dev/null
          unzip -q -o /tmp/modded.apk 'lib/arm64-v8a/*' -d /tmp/mod_lib 2>/dev/null
          echo "=== OFFICIAL LIBS ==="
          ls -1 /tmp/off_lib/lib/arm64-v8a/ | sort
          echo "=== MODDED LIBS ==="
          ls -1 /tmp/mod_lib/lib/arm64-v8a/ | sort

      - name: 1. File size comparison
        run: |
          echo "=== SIZE DIFFS (>100 bytes) ==="
          cd /tmp/off_lib/lib/arm64-v8a
          for f in *.so; do
            OFF_SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            MOD_FILE=$(find /tmp/mod_lib/lib/arm64-v8a -name "$f" 2>/dev/null | head -1)
            if [ -f "$MOD_FILE" ]; then
              MOD_SIZE=$(stat -c%s "$MOD_FILE" 2>/dev/null || echo 0)
              DIFF=$((OFF_SIZE - MOD_SIZE))
              DIFF_ABS=${DIFF#-}
              if [ "$DIFF_ABS" -gt 100 ]; then
                echo "DIFFERENT: $f off=$OFF_SIZE mod=$MOD_SIZE delta=$DIFF"
              fi
            else
              echo "OFFICIAL-ONLY: $f ($OFF_SIZE)"
            fi
          done
          cd /tmp/mod_lib/lib/arm64-v8a
          for f in *.so; do
            OFF_FILE=$(find /tmp/off_lib/lib/arm64-v8a -name "$f" 2>/dev/null | head -1)
            if [ ! -f "$OFF_FILE" ]; then
              echo "MODDED-ONLY: $f ($(stat -c%s "$f" 2>/dev/null) bytes)"
            fi
          done

      - name: 2. Binary hex diff of changed libs
        run: |
          cd /tmp/off_lib/lib/arm64-v8a
          for f in *.so; do
            MOD_FILE=$(find /tmp/mod_lib/lib/arm64-v8a -name "$f" 2>/dev/null | head -1)
            [ -z "$MOD_FILE" ] && continue
            OFF_SIZE=$(stat -c%s "$f")
            MOD_SIZE=$(stat -c%s "$MOD_FILE")
            DIFF=$((OFF_SIZE - MOD_SIZE))
            DIFF_ABS=${DIFF#-}
            [ "$DIFF_ABS" -le 100 ] && continue
            echo "=== $f ==="
            python3 -c "
import sys
d1 = open('$f','rb').read()
d2 = open('$MOD_FILE','rb').read()
maxlen = min(len(d1), len(d2))
diffs = []
for i in range(0, maxlen, 16):
    b1 = d1[i:i+16]
    b2 = d2[i:i+16]
    if b1 != b2:
        diffs.append(i)
        if len(diffs) <= 15:
            s1 = ''.join(chr(b) if 32<=b<=126 else '.' for b in b1)
            s2 = ''.join(chr(b) if 32<=b<=126 else '.' for b in b2)
            print(f'  @0x{i:06x}')
            print(f'    off: {\" \".join(f\"{b:02x}\" for b in b1)}  {s1}')
            print(f'    mod: {\" \".join(f\"{b:02x}\" for b in b2)}  {s2}')
            print()
if len(diffs) > 15:
    print(f'  ... +{len(diffs)-15} more regions')
print(f'  Total diff regions: {len(diffs)}')
"
          done

      - name: 3. String diff in changed libs
        run: |
          cd /tmp/off_lib/lib/arm64-v8a
          for f in *.so; do
            MOD_FILE=$(find /tmp/mod_lib/lib/arm64-v8a -name "$f" 2>/dev/null | head -1)
            [ -z "$MOD_FILE" ] && continue
            OFF_SIZE=$(stat -c%s "$f")
            MOD_SIZE=$(stat -c%s "$MOD_FILE")
            DIFF=$((OFF_SIZE - MOD_SIZE))
            DIFF_ABS=${DIFF#-}
            [ "$DIFF_ABS" -le 100 ] && continue
            echo "=== STRINGS: $f ==="
            python3 -c "
import subprocess
off_set = set()
mod_set = set()
for line in subprocess.check_output(['strings','-n','6','$f']).decode('latin-1').split('\n'):
    s = line.strip()
    if s: off_set.add(s)
for line in subprocess.check_output(['strings','-n','6','$MOD_FILE']).decode('latin-1').split('\n'):
    s = line.strip()
    if s: mod_set.add(s)
new_s = mod_set - off_set
keywords = ['signature','verify','certif','checksum','hash','integriti','bypass','anti','tamper','detect','root','debug']
for s in sorted(new_s):
    if any(k in s.lower() for k in keywords):
        print(f'  [${k}] {s[:100]}')
# Show any unusually long new strings
for s in sorted(new_s):
    if len(s) > 40 and any(k in s.lower() for k in keywords):
        print(f'  [LONG] {s[:150]}')
if not any(any(k in s.lower() for k in keywords) for s in new_s):
    for s in sorted(new_s)[:10]:
        print(f'  {s[:100]}' if len(s) > 100 else f'  {s}')
" 2>/dev/null
          done

      - name: 4. DEX hash comparison
        run: |
          echo "=== DEX HASH DIFF ==="
          python3 -c "
import zipfile, hashlib
off = zipfile.ZipFile('/tmp/official.apk')
mod = zipfile.ZipFile('/tmp/modded.apk')
all_dex = set(off.namelist()) | set(mod.namelist())
all_dex = [f for f in all_dex if f.endswith('.dex')]
for f in sorted(all_dex):
    off_d = off.read(f) if f in off.namelist() else None
    mod_d = mod.read(f) if f in mod.namelist() else None
    off_h = hashlib.sha256(off_d).hexdigest()[:16] if off_d else 'N/A'
    mod_h = hashlib.sha256(mod_d).hexdigest()[:16] if mod_d else 'N/A'
    match = 'SAME' if off_h == mod_h else 'DIFF'
    if off_h != mod_h:
        print(f'  {f}: {match}')
        print(f'    off: {off_h} ({len(off_d) if off_d else 0} bytes)')
        print(f'    mod: {mod_h} ({len(mod_d) if mod_d else 0} bytes)')
"
