name: Extract Signature Bypass Patches
on:
  workflow_dispatch: {}
env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
jobs:
  diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get APKs
        run: curl -sL "$OFFICIAL_URL" -o /tmp/off.apk -w "OFF: HTTP %{http_code}, size: %{size_download}\n"
      - name: Get modded
        run: curl -sL "$MODDED_URL" -o /tmp/mod.apk -w "MOD: HTTP %{http_code}, size: %{size_download}\n"

      - name: List native libs
        run: |
          echo "=== OFFICIAL==="; unzip -l /tmp/off.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}'
          echo "=== MODDED==="; unzip -l /tmp/mod.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}'

      - name: Size diff
        run: |
          unzip -l /tmp/off.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}' | sort > /tmp/o.txt
          unzip -l /tmp/mod.apk 'lib/arm64-v8a/*.so' 2>/dev/null | awk '/\.so/{print $4,$1}' | sort > /tmp/m.txt
          echo "=== SIZE DIFF ==="; join -j1 /tmp/o.txt /tmp/m.txt | awk '{d=$2-$3;d=d<0?-d:d} d>100{print "DIFF: "$1" off="$2" mod="$3" delta="($2-$3)}'
          echo "=== MOD-ONLY ==="; join -v2 /tmp/o.txt /tmp/m.txt | awk '{print $1}'

      - name: Hex diff
        run: |
          mkdir -p /tmp/ol /tmp/ml
          unzip -q /tmp/off.apk 'lib/arm64-v8a/*.so' -d /tmp/ol 2>/dev/null
          unzip -q /tmp/mod.apk 'lib/arm64-v8a/*.so' -d /tmp/ml 2>/dev/null
          cd /tmp/ol/lib/arm64-v8a
          for f in *.so; do
            mf="/tmp/ml/lib/arm64-v8a/$f"; [ ! -f "$mf" ] && continue
            os=$(stat -c%s "$f"); ms=$(stat -c%s "$mf")
            d=$((os-ms)); d=${d#-}; [ $d -le 100 ] && continue
            export F="$f" OF="$f" MF="$mf" OS="$os" MS="$ms"
            python3 << 'EOF'
import os
f1="/tmp/ol/lib/arm64-v8a/"+os.environ['F']
f2=os.environ['MF']
d1=open(f1,'rb').read(); d2=open(f2,'rb').read()
n=0
for i in range(0,min(len(d1),len(d2)),16):
    if d1[i:i+16]!=d2[i:i+16]:
        if n<8:
            s1=''.join(chr(b) if 32<=b<=126 else '.' for b in d1[i:i+16])
            s2=''.join(chr(b) if 32<=b<=126 else '.' for b in d2[i:i+16])
            print('@0x%05x'%i)
            print('  off: '+' '.join('%02x'%b for b in d1[i:i+16])+'  '+s1)
            print('  mod: '+' '.join('%02x'%b for b in d2[i:i+16])+'  '+s2)
        n+=1
print(os.environ['F']+': '+str(n)+' diff regions')
EOF
          done

      - name: DEX hash
        run: |
          python3 << 'EOF'
import zipfile,hashlib
off=zipfile.ZipFile('/tmp/off.apk'); mod=zipfile.ZipFile('/tmp/mod.apk')
seen=set()
for f in off.namelist()+mod.namelist():
    if not f.endswith('.dex') or f in seen: continue
    seen.add(f)
    od=off.read(f) if f in off.namelist() else None
    md=mod.read(f) if f in mod.namelist() else None
    if od and md:
        if hashlib.sha256(od).hexdigest()!=hashlib.sha256(md).hexdigest(): print('DIFF: '+f+' off='+str(len(od))+' mod='+str(len(md)))
    elif od: print('OFF-ONLY: '+f+' ('+str(len(od))+')')
    elif md: print('MOD-ONLY: '+f+' ('+str(len(md))+')')
EOF

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
