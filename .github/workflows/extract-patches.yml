name: Extract Signature Bypass Patches
on:
  workflow_dispatch: {}
env:
  OFFICIAL_URL: https://cloud.dsdog.tk/d/google/temp/%E7%95%AA%E8%8C%84%E5%85%8D%E8%B4%B9%E5%B0%8F%E8%AF%B4_7.2.4.32.apk?sign=xUavME2Rt4Vf1FTbCppPq7sU8bRUFh29hrbIhdsXon4=:0
  MODDED_URL: https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk
jobs:
  diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar" -o /opt/apktool.jar
          printf '#!/bin/bash\njava -jar /opt/apktool.jar "$@"\n' > /opt/apktool && chmod +x /opt/apktool

      - name: Download APKs
        run: |
          curl -sL "$OFFICIAL_URL" -o /tmp/official.apk -w "OFF: HTTP %{http_code}, size: %{size_download}\n"
          curl -sL "$MODDED_URL" -o /tmp/modded.apk -w "MOD: HTTP %{http_code}, size: %{size_download}\n"

      - name: Decode
        run: |
          /opt/apktool d /tmp/official.apk -o /tmp/official -f 2>&1 | tail -1
          /opt/apktool d /tmp/modded.apk -o /tmp/modded -f 2>&1 | tail -1

      - name: Extract patched files
        run: |
          # Target files identified from previous analysis
          PATHS=""
          for path in \
            android/app/ActivityThread.smali \
            android/app/ActivityThreadCompat.smali; do
            OFF=$(find /tmp/official -name "$(basename $path)" -path "*/$(dirname $path)/*" 2>/dev/null | head -1)
            MOD=$(find /tmp/modded -name "$(basename $path)" -path "*/$(dirname $path)/*" 2>/dev/null | head -1)
            echo "=== $(basename $path) ==="
            echo "OFF: $OFF ($([ -f "$OFF" ] && wc -l < "$OFF" || echo 0) lines)"
            echo "MOD: $MOD ($([ -f "$MOD" ] && wc -l < "$MOD" || echo 0) lines)"
            if [ -f "$OFF" ] && [ -f "$MOD" ]; then
              diff -u "$OFF" "$MOD" 2>/dev/null | head -200
            fi
          done

      - name: Extract AppFactory
        run: |
          echo "=== AppFactory (modded only) ==="
          find /tmp/modded -path '*/com/pandora/*' -name '*.smali' 2>/dev/null | while read f; do
            NAME=$(basename "$(dirname "$f")")/$(basename "$f")
            echo "--- $NAME ($(wc -l < "$f") lines) ---"
            head -50 "$f"
            echo "..."
          done

      - name: Extract getPackageInfo patches
        run: |
          echo "=== getPackageInfo hooks ==="
          for fname in zo4/b.smali uo4/l.smali; do
            echo "--- $fname ---"
            f=$(find /tmp/modded -name "$(basename $fname)" -path "*/$(dirname $fname)/*" 2>/dev/null | head -1)
            OFF=$(find /tmp/official -name "$(basename $fname)" -path "*/$(dirname $fname)/*" 2>/dev/null | head -1)
            if [ -f "$f" ] && [ -f "$OFF" ]; then
              diff -u "$OFF" "$f" 2>/dev/null | head -100
            elif [ -f "$f" ]; then
              echo "modded-only file: $(wc -l < "$f") lines"
              head -50 "$f"
            fi
          done

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
