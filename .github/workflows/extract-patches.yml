name: Extract Fanqie Novel Patches
on:
  workflow_dispatch:
    inputs:
      apk-mod:
        description: APK asset name (modded)
        required: false
        default: fanqie_novel_7.2.4.19.apk
        type: string
      apk-official:
        description: APK asset name (official)
        required: false
        default: fanqie_novel_official_7.2.4.32.apk
        type: string

jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/apk-assets"
          curl -sL -o modded.apk "$RELEASE_URL/${{ inputs.apk-mod }}"
          curl -sL -o official.apk "$RELEASE_URL/${{ inputs.apk-official }}"

      - name: Native lib size comparison
        run: python3 .github/scripts/native-lib-diff.py

      - name: DEX hash comparison
        run: python3 .github/scripts/dex-hash-diff.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install apktool
        run: |
          curl -sL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Decompile official APK
        run: java -jar apktool.jar d -f official.apk -o official_smali

      - name: Decompile modded APK
        run: java -jar apktool.jar d -f modded.apk -o modded_smali

      - name: Extract DPatch framework & Lancet hooks
        run: bash .github/scripts/extract-patches.sh

      - name: Search key references
        run: bash .github/scripts/search-references.sh

      - name: Find actually modified smali files
        run: python3 .github/scripts/find-modified-files.py

      - name: Upload patches
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-patches
          path: patches/
          retention-days: 90
