name: Overlay Full Fanqie APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APKs
        run: |
          curl -sL -o official.apk "https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_official_7.2.4.32.apk"
          curl -sL -o modded.apk "https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk"

      - name: Install apktool
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar

      - name: Decompile both
        run: |
          java -jar apktool.jar d -f official.apk -o official_smali
          java -jar apktool.jar d -f modded.apk -o modded_smali

      - name: Overlay all smali + AndroidManifest
        run: |
          python3 -c "
import os, shutil
mod, off = 'modded_smali', 'official_smali'
for item in sorted(os.listdir(mod)):
    s, d = os.path.join(mod, item), os.path.join(off, item)
    if not os.path.isdir(s) or item == 'original': continue
    if item.startswith('smali') or item == 'unknown':
        print(f'Overlay {item}')
        if os.path.exists(d): shutil.rmtree(d)
        shutil.copytree(s, d)
shutil.copy2(os.path.join(mod, 'AndroidManifest.xml'), os.path.join(off, 'AndroidManifest.xml'))
print('DONE')
"

      - name: Rebuild
        run: java -jar apktool.jar b official_smali -o unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Debug, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --out patched.apk unsigned.apk
          ls -lh patched.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-full-overlay
          path: patched.apk
          retention-days: 90
