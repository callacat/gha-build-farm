name: Fanqie Mod - Smali Patch APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK download URL'
        required: true
        default: 'https://github.com/callacat/gha-build-farm/releases/download/fanqie-mod-7.2.4.19/fanqie_mod_7.2.4.19.apk'
      version:
        description: 'Version number'
        required: true
        default: '7.2.4.19'
      release_tag:
        description: 'Release tag'
        required: true
        default: 'fanqie-mod-7.2.4.19-patched'

permissions:
  contents: write
  actions: read

jobs:
  patch:
    name: Smali Patch Fanqie APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update && sudo apt-get install -y apktool

      - name: Install apksigner
        run: |
          sudo apt-get install -y android-sdk-build-tools

      - name: Install 7zip (for extraction)
        run: |
          sudo apt-get install -y p7zip-full

      - name: Download original APK
        run: |
          wget -q "${{ github.event.inputs.apk_url }}" -O fanqie_original.apk
          echo "Original APK size: $(du -h fanqie_original.apk | cut -f1)"

      - name: Decode APK with apktool (get smali)
        run: |
          apktool d -f fanqie_original.apk -o fanqie_smali
          echo "Decoded to smali: $(du -sh fanqie_smali)"

      - name: Patch oneseeker.top C2 domain
        run: |
          # Find and replace oneseeker.top in string literals only
          find fanqie_smali -name "*.smali" -type f -exec sed -i 's/"oneseeker\.top"/""/g' {} \;
          # Also replace in const-string with localhost to keep valid syntax
          find fanqie_smali -name "*.smali" -type f -exec sed -i 's/const-string v[0-9]*, "oneseeker\.top"/const-string v0, "localhost"/g' {} \;
          echo "✅ Patched oneseeker.top"

      - name: Patch force_upgrade_dialog
        run: |
          # Only clear string literals, not identifiers
          find fanqie_smali -name "*.smali" -type f -exec sed -i 's/"force_upgrade_dialog"/""/g' {} \;
          echo "✅ Patched force_upgrade_dialog strings"

      - name: Patch app_update_config_v531
        run: |
          find fanqie_smali -name "*.smali" -type f -exec sed -i 's/"app_update_config_v531"/""/g' {} \;
          echo "✅ Patched app_update_config_v531"

      - name: Patch 强制升级弹窗
        run: |
          find fanqie_smali -name "*.smali" -type f -exec sed -i 's/"强制升级弹窗"/""/g' {} \;
          echo "✅ Patched 强制升级弹窗"

      - name: Patch Armadillo magic
        run: |
          find fanqie_smali -name "*.smali" -type f -exec sed -i 's/"Armadillo"/""/g' {} \;
          echo "✅ Patched Armadillo"

      - name: NOP C2 connection method in iD.smali
        run: |
          # Find com/iD.smali and NOP the a() method that creates Socket
          ID_SMALI=$(find fanqie_smali -name "iD.smali" -type f | head -1)
          if [ -n "$ID_SMALI" ]; then
            echo "Found: $ID_SMALI"
            # Show the a() method
            grep -n "method a" "$ID_SMALI" || true
            # Use awk to replace method body between .method a and .end method
            awk '
              /\.method.*a\(\)Ljava\/lang\/Object;/ { in_method=1; print; print "    .locals 1"; print "    const/4 v0, 0x0"; print "    return-object v0"; next }
              in_method && /\.end method/ { in_method=0; print; next }
              in_method { next }
              { print }
            ' "$ID_SMALI" > "$ID_SMALI.tmp" && mv "$ID_SMALI.tmp" "$ID_SMALI"
            echo "✅ NOP'd iD.a() method"
          else
            echo "⚠️ iD.smali not found"
          fi

      - name: NOP getConfig in IAppUpdateConfig$$Impl.smali
        run: |
          # Find the getConfig method and make it return null
          CONFIG_SMALI=$(find fanqie_smali -name "IAppUpdateConfig\$\$Impl.smali" -type f | head -1)
          if [ -n "$CONFIG_SMALI" ]; then
            echo "Found: $CONFIG_SMALI"
            awk '
              /\.method.*getConfig\(\)Lcom\/dragon\/read\/component\/biz\/impl\/update\/IAppUpdateConfig;/ { in_method=1; print; print "    .locals 1"; print "    const/4 v0, 0x0"; print "    return-object v0"; next }
              in_method && /\.end method/ { in_method=0; print; next }
              in_method { next }
              { print }
            ' "$CONFIG_SMALI" > "$CONFIG_SMALI.tmp" && mv "$CONFIG_SMALI.tmp" "$CONFIG_SMALI"
            echo "✅ NOP'd IAppUpdateConfig.getConfig()"
          else
            echo "⚠️ IAppUpdateConfig$$Impl.smali not found"
          fi

      - name: Fix resource directories (remove problematic res arm)
        run: |
          # Remove res arm directory which breaks apktool rebuild
          find fanqie_smali -type d -name "res *" -exec echo "Removing: {}" \; -exec rm -rf {} \;
          # Also check deeper paths
          find fanqie_smali -type d -path "*/res *" -exec echo "Removing nested: {}" \; -exec rm -rf {} \;

      - name: Rebuild APK with apktool
        run: |
          apktool b fanqie_smali -o fanqie_patched_unsigned.apk
          echo "Patched unsigned APK size: $(du -h fanqie_patched_unsigned.apk | cut -f1)"

      - name: Setup keystore
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > debug.keystore
          echo "Keystore ready"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:${KEYSTORE_PASS} \
            --key-pass pass:${KEY_PASS} \
            --ks-key-alias ${KEY_ALIAS} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            fanqie_patched_unsigned.apk

      - name: Verify signature
        run: |
          apksigner verify --verbose fanqie_patched_unsigned.apk

      - name: Zipalign (optional but recommended)
        run: |
          zipalign -v 4 fanqie_patched_unsigned.apk fanqie_patched.apk
          echo "Final APK size: $(du -h fanqie_patched.apk | cut -f1)"

      - name: Quick smoke test - verify patches
        run: |
          # Extract and check
          mkdir -p verify_extract
          unzip -q fanqie_patched.apk -d verify_extract
          # Check for remaining bad strings
          echo "=== Patch verification ==="
          for term in "oneseeker.top" "force_upgrade_dialog" "app_update_config_v531" "Armadillo"; do
            if grep -r "$term" verify_extract/ 2>/dev/null; then
              echo "❌ $term STILL PRESENT"
            else
              echo "✅ $term cleared"
            fi
          done

      - name: Upload patched APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-patched-apk
          path: fanqie_patched.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.event.inputs.release_tag != ''
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Fanqie Mod ${{ github.event.inputs.version }} (Smali Patched)"
          body: |
            ## 番茄免费小说鹿属修改版 - 后门清理版 (Smali级补丁)

            **原版**: fanqie_mod_7.2.4.19.apk (236 MB)
            **补丁版**: 去除黑产后门、强制升级弹窗、更新检测

            ### 清理内容
            - ✅ 清空 `oneseeker.top` C2 域名 (端口 10000-10020 随机)
            - ✅ 清空 `force_upgrade_dialog` 强制升级弹窗标识
            - ✅ 清空 `app_update_config_v531` 更新配置键
            - ✅ 清空 `强制升级弹窗` 中文标识
            - ✅ 清空 `Armadillo` 协议魔数
            - ✅ NOP `com.iD.a()` Socket 连接方法
            - ✅ NOP `IAppUpdateConfig.getConfig()` 配置获取方法

            ### 验证
            - `apksigner verify` 通过
            - 关键字符串已清空确认

            ### 安装说明
            1. 卸载原版
            2. 安装此补丁版
            3. 首次运行需授权存储权限

            ---
            *由 GHA build-farm 自动构建*
          files: fanqie_patched.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f debug.keystore fanqie_original.apk fanqie_patched_unsigned.apk
          rm -rf fanqie_smali verify_extract