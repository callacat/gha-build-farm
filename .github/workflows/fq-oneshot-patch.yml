name: Fanqie Oneshot — 清空 oneseeker.top + 重打包
on:
  workflow_dispatch:
    inputs:
      modded-tag:
        description: 'Modded APK release tag'
        required: true
        default: 'fq-modded-7.2.4.19'
        type: string
      output-tag:
        description: 'Output release tag'
        required: true
        default: 'fq-patched-7.2.4.19'
        type: string

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download modded APK
        run: |
          gh release download "${{ inputs.modded-tag }}" \
            -R ${{ github.repository }} -p 'app.apk' \
            --dir /tmp
          mv /tmp/app.apk /tmp/modded.apk
          ls -lh /tmp/modded.apk
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Patch oneseeker.top + rebuild APK (manual ZIP for Python 3.10+ compat)
        run: |
          python3 << 'PYEOF'
          import struct, zlib, os

          apk = '/tmp/modded.apk'
          out = '/tmp/patched-unsigned.apk'
          DEX_NAME = 'classes27.dex'

          with open(apk, 'rb') as f:
              data = f.read()

          # ---- Parse central directory ----
          eocd = len(data) - 22
          while eocd > 0 and data[eocd:eocd+4] != b'PK\x05\x06':
              eocd -= 1
          coff = struct.unpack_from('<I', data, eocd+16)[0]
          csz = struct.unpack_from('<I', data, eocd+12)[0]
          entries = []
          pos = coff
          while pos < coff + csz:
              if data[pos:pos+4] != b'PK\x01\x02': break
              nlen = struct.unpack_from('<H', data, pos+28)[0]
              elen = struct.unpack_from('<H', data, pos+30)[0]
              clen = struct.unpack_from('<H', data, pos+32)[0]
              entries.append({
                  'name': data[pos+46:pos+46+nlen].decode('utf-8', errors='replace'),
                  'lhoff': struct.unpack_from('<I', data, pos+42)[0],
                  'crc': struct.unpack_from('<I', data, pos+16)[0],
                  'csize': struct.unpack_from('<I', data, pos+20)[0],
                  'usize': struct.unpack_from('<I', data, pos+24)[0],
                  'ctype': struct.unpack_from('<H', data, pos+10)[0],
              })
              pos += 46 + nlen + elen + clen

          print(f"Found {len(entries)} entries")

          # ---- Browse and patching DEX classes27 ----
          dex_entry = next(e for e in entries if e['name'] == DEX_NAME)
          lh = dex_entry['lhoff']
          lh_nlen = struct.unpack_from('<H', data, lh+26)[0]
          lh_elen = struct.unpack_from('<H', data, lh+28)[0]
          dex_start = lh + 30 + lh_nlen + lh_elen
          dex_data = data[dex_start:dex_start+dex_entry['csize']]

          raw = bytearray(zlib.decompress(dex_data, -zlib.MAX_WBITS))
          assert len(raw) == dex_entry['usize']
          idx = raw.find(b'oneseeker.top')
          assert idx != -1, "oneseeker.top not found"
          assert raw[idx-1] == 13
          raw[idx-1] = 0
          print(f"✓ Patched oneseeker.top at DEX offset {idx-1}")

          new_dex = zlib.compress(bytes(raw))[2:-4]
          new_crc = zlib.crc32(bytes(raw)) & 0xffffffff
          new_csize = len(new_dex)
          new_usize = len(raw)

          # ---- Rebuild ZIP entries raw ----
          SIG_ENDS = ('.RSA', '.SF', '.MF', '.DSA', '.EC')
          # resources.arsc must be STORED (uncompressed) for Android R+
          STORED_NAMES = ('resources.arsc', 'AndroidManifest.xml')
          new_central = bytearray()
          new_data_block = bytearray()
          new_count = 0

          for e in entries:
              fn = e['name']
              if fn.startswith('META-INF/') and any(fn.endswith(x) for x in SIG_ENDS):
                  continue

              lh = e['lhoff']
              lh_nlen = struct.unpack_from('<H', data, lh+26)[0]
              lh_elen = struct.unpack_from('<H', data, lh+28)[0]
              dstart = lh + 30 + lh_nlen + lh_elen
              compressed = data[dstart:dstart+e['csize']]

              if fn == DEX_NAME:
                  compressed = new_dex
                  crc = new_crc
                  usize = new_usize
                  csize = new_csize
                  ctype = 8
              elif fn in STORED_NAMES:
                  # Must be STORED (uncompressed) and 4-byte aligned for Android R+
                  # If originally compressed, decompress first
                  if e['ctype'] == 0:
                      crc = e['crc']
                      ctype = 0
                      csize = e['usize']
                      usize = e['usize']
                  else:
                      # Decompress to STORED
                      compressed = zlib.decompress(compressed, -zlib.MAX_WBITS)
                      assert len(compressed) == e['usize']
                      crc = zlib.crc32(compressed) & 0xffffffff  # CRC of UNCOMPRESSED data
                      ctype = 0
                      csize = e['usize']
                      usize = e['usize']
              else:
                  crc = e['crc']
                  usize = e['usize']
                  csize = e['csize']
                  ctype = e['ctype']

              loff = len(new_data_block)
              fnb = fn.encode('utf-8')

              lf = bytearray(30 + len(fnb))
              struct.pack_into('<I', lf, 0, 0x04034b50)
              struct.pack_into('<H', lf, 4, 20); struct.pack_into('<H', lf, 6, 0)
              struct.pack_into('<H', lf, 8, ctype); struct.pack_into('<H', lf, 10, 0)
              struct.pack_into('<H', lf, 12, 0); struct.pack_into('<I', lf, 14, crc)
              struct.pack_into('<I', lf, 18, csize); struct.pack_into('<I', lf, 22, usize)
              struct.pack_into('<H', lf, 26, len(fnb)); struct.pack_into('<H', lf, 28, 0)
              lf[30:] = fnb

              ce = bytearray(46 + len(fnb))
              struct.pack_into('<I', ce, 0, 0x02014b50)
              struct.pack_into('<H', ce, 4, 20); struct.pack_into('<H', ce, 6, 20)
              struct.pack_into('<H', ce, 8, 0); struct.pack_into('<H', ce, 10, ctype)
              struct.pack_into('<H', ce, 12, 0); struct.pack_into('<H', ce, 14, 0)
              struct.pack_into('<I', ce, 16, crc); struct.pack_into('<I', ce, 20, csize)
              struct.pack_into('<I', ce, 24, usize); struct.pack_into('<H', ce, 28, len(fnb))
              struct.pack_into('<H', ce, 30, 0); struct.pack_into('<H', ce, 32, 0)
              struct.pack_into('<H', ce, 34, 0); struct.pack_into('<H', ce, 36, 0)
              struct.pack_into('<H', ce, 38, 0); struct.pack_into('<I', ce, 42, loff)
              ce[46:] = fnb

              new_data_block += lf + compressed
              new_central += ce
              new_count += 1

          eocd = bytearray(22)
          struct.pack_into('<I', eocd, 0, 0x06054b50)
          struct.pack_into('<H', eocd, 4, 0); struct.pack_into('<H', eocd, 6, 0)
          struct.pack_into('<H', eocd, 8, new_count); struct.pack_into('<H', eocd, 10, new_count)
          struct.pack_into('<I', eocd, 12, len(new_central))
          struct.pack_into('<I', eocd, 16, len(new_data_block))
          struct.pack_into('<H', eocd, 20, 0)

          with open(out, 'wb') as f:
              f.write(new_data_block + new_central + eocd)

          print(f"✓ APK: {len(new_data_block + new_central + eocd)/1024/1024:.1f} MB ({new_count} entries)")

          if b'oneseeker.top' not in (new_data_block + new_central + eocd):
              print("✓ oneseeker.top removed")
          else:
              print("  WARNING: oneseeker.top still present")
              exit(1)

          PYEOF

      - name: Zipalign (4-byte align for resources.arsc on Android R+)
        run: |
          # Find zipalign in Android SDK build-tools
          ZIPALIGN=$(find /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | head -1)
          if [ -z "$ZIPALIGN" ]; then
            ZIPALIGN=$(find /opt/android/sdk/build-tools -name zipalign 2>/dev/null | head -1)
          fi
          if [ -z "$ZIPALIGN" ]; then
            ZIPALIGN=$(find /android/sdk/build-tools -name zipalign 2>/dev/null | head -1)
          fi
          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found in standard locations, checking PATH..."
            which zipalign
            ZIPALIGN=zipalign
          fi
          echo "Using zipalign: $ZIPALIGN"
          "$ZIPALIGN" -v -p 4 /tmp/patched-unsigned.apk /tmp/patched-aligned.apk
          ls -lh /tmp/patched-aligned.apk

      - name: Sign (apksigner for V2/V3)
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore \
            -alias androiddebugkey -keypass android -storepass android \
            -keyalg RSA -validity 365 -dname 'CN=Debug,O=Android,C=US'
          # Find apksigner
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /opt/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=apksigner
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks /tmp/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out /tmp/patched-signed.apk \
            /tmp/patched-aligned.apk
          ls -lh /tmp/patched-signed.apk

      - name: Verify
        run: |
          # Find apksigner
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /opt/android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find /android/sdk/build-tools -name apksigner 2>/dev/null | head -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=apksigner
          fi
          "$APKSIGNER" verify --print-certs /tmp/patched-signed.apk 2>&1 | head -10
          unzip -l /tmp/patched-signed.apk 2>/dev/null | grep classes27.dex | head -3
          if strings /tmp/patched-signed.apk | grep -q 'oneseeker.top'; then
            echo "oneseeker.top FOUND! PATCH FAILED"
            exit 1
          fi
          ls -lh /tmp/patched-signed.apk
          echo "✓ All checks passed"

      - name: Upload to Release
        run: |
          TAG="${{ inputs.output-tag }}"
          gh release create "$TAG" /tmp/patched-signed.apk \
            -R ${{ github.repository }} \
            --title "Fanqie patched ${{ inputs.output-tag }}" \
            --notes "Patch: cleared oneseeker.top in com/iD.smali" \
            --generate-notes 2>/dev/null || \
          gh release upload "$TAG" /tmp/patched-signed.apk \
            -R ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clean old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 10
