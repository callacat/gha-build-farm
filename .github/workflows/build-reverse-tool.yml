name: Build Reverse Tool

# Prevent concurrent builds for the same tool
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tool }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool to build'
        required: true
        type: choice
        options:
          - pentestswarm
          - anything-analyzer-image
          - frida-custom-wheel
      version:
        description: 'Version tag (e.g. latest, v1.2.3)'
        required: false
        default: 'latest'
        type: string
      custom-args:
        description: 'Extra build args as JSON string'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (for image builds)
        if: contains(inputs.tool, '-image')
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (for image builds)
        if: contains(inputs.tool, '-image')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute build script
        id: build
        run: |
          SCRIPT=".build-scripts/${{ inputs.tool }}.sh"
          chmod +x "$SCRIPT"
          bash "$SCRIPT" '${{ inputs.version }}' '${{ inputs.custom-args }}'
          echo "dir=$(cat /tmp/build-artifact-dir.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reverse-tool-${{ inputs.tool }}${{ inputs.version != 'latest' && format('-{0}', inputs.version) || '' }}-linux-x64
          path: ${{ steps.build.outputs.dir }}/
          if-no-files-found: error

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5

