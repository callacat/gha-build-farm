name: Targetted Fanqie APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APKs
        run: |
          curl -sL -o official.apk "https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_official_7.2.4.32.apk"
          curl -sL -o modded.apk "https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie_novel_7.2.4.19.apk"
          curl -sL -o npatch.jar https://github.com/7723mod/NPatch/releases/download/v1.0.5/jar-v1.0.5-639-release.jar
          curl -sL -o bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          curl -sL -o module.apk https://github.com/callacat/gha-build-farm/releases/download/apk-assets/fanqie-hook-module-dpatch.apk

      - name: Install apktool
        run: curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar

      - name: Decompile both
        run: |
          java -jar apktool.jar d -f official.apk -o official_smali
          java -jar apktool.jar d -f modded.apk -o modded_smali

      - name: Targetted overlay - checkSign + DPatch + Manifest
        run: |
          python3 << 'PYEOF'
import os, shutil
mod, off = 'modded_smali', 'official_smali'
# Only overlay directories that contain critical files
KEY_FILES = [
    'checkSign', 'CheckSign', 'check_sign',
    'NovelCommonParam', 'AntiCheatParam', 'HeaderArgs',
    'AppFactory', 'CreatorProxy',
    'zo4/b', 'uo4/l',
    'DeviceRegister',
]
# Find which smali dirs in modded contain these
target_dirs = set()
for root, dirs, files in os.walk(mod):
    for f in files:
        fpath = os.path.join(root, f)
        try:
            with open(fpath, 'rb') as fh:
                data = fh.read()
                for kw in KEY_FILES:
                    if kw.encode() in data:
                        rel = os.path.relpath(root, mod)
                        parts = rel.split(os.sep)
                        top = parts[0]
                        if top.startswith('smali') or top == 'unknown':
                            target_dirs.add(top)
                        break
        except:
            pass
target_dirs = sorted(target_dirs)
print(f'Targeting {len(target_dirs)} dirs: {target_dirs}')
for item in target_dirs:
    s, d = os.path.join(mod, item), os.path.join(off, item)
    if os.path.exists(d): shutil.rmtree(d)
    shutil.copytree(s, d)
    print(f'  Overlaid {item}')
shutil.copy2(os.path.join(mod, 'AndroidManifest.xml'), os.path.join(off, 'AndroidManifest.xml'))
print('DONE')
PYEOF

      - name: Rebuild
        run: java -jar apktool.jar b official_smali -o unsigned.apk

      - name: NPatch embed DPatch module
        run: |
          printf 'security.provider.9=org.bouncycastle.jce.provider.BouncyCastleProvider\n' > java.security
          java -cp bcprov.jar:npatch.jar -Djava.security.properties=./java.security \
            top.nkbe.npatch.patch.NPatch unsigned.apk --embed module.apk -f -o npatched
          cp npatched/*.apk patched.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Debug, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --out signed-final.apk patched.apk
          ls -lh signed-final.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fanqie-targetted
          path: signed-final.apk
          retention-days: 90
